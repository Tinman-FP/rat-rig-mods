# Rat Rig V-Core 4.1 500: single-carriage CoreXY, 12 mm belts, Bondtech INDX (5 tools)
# Kalico. Was: V-Core 4 500 IDEX, mainline Klipper + hybrid_corexy_ratrig.
#
# Bondtech's INDX macros come from their repository, pinned (see INSTALL.md section 12):
#   git clone https://github.com/BondtechAB/INDX.git ~/printer_data/config/INDX
#   git -C ~/printer_data/config/INDX checkout ae64179
# Only their indx.cfg is replaced, by INDX_Tools.cfg. Their other three files are used as shipped.
#####################################################################

[include mainsail.cfg]

# Core architecture
[include MCU.cfg]
[include Core_Printer.cfg]
[include Motion_XY.cfg]
[include Motion_Z.cfg]
[include INDX_Head.cfg]
[include System.cfg]

# Bondtech INDX: tools, tool changes, calibration, homing. Order matters:
# homing_indx.cfg comes after their homing.cfg so its [homing_override] wins.
[include INDX_Tools.cfg]
[include INDX/macros/indx-tc-macros.cfg]
[include INDX/macros/indx-cal.cfg]
[include INDX/macros/homing.cfg]
[include homing_indx.cfg]

[include Leveling.cfg]
[include Stations.cfg]
[include Filament_Sensors.cfg]
[include Adaptive_Heat_Soak.cfg]
[include PLR_Shell.cfg]      # Kalico has gcode_shell_command built in
[include PLR.cfg]
[include Resonance.cfg]

# Working macro sets
[include macros.cfg]
[include Gcode_Macro.cfg]
[include Test_Macros.cfg]

[include High_Power_Fan_HE2.cfg]   # HE2 high-power fan control via external MOSFET (PB10).
[include Heated_Chamber.cfg]
[include RGB.cfg]
[include Acceleration_RGB.cfg]

# Retired with the conversion (keep them out of the config folder, or at least not included):
#   Toolheads.cfg, EBB42_T0.cfg, EBB42_T1.cfg, Compatibility.cfg       -> INDX_Head.cfg
#   Beacon.cfg, Beacon_T0*.cfg, Beacon_T1*.cfg, beacon_active.cfg,
#   Beacon_IDEX.cfg, Dual_Beacon_Calibration.cfg,
#   Adaptive_Heat_Soak_Beacon_Shell.cfg, scripts/ahs_beacon_wait.py    -> the load cell probes
#   Camera_XY.cfg, Toolchanger_Calibrate.cfg                            -> Bondtech's CAL_ONE/TWO/THREE
#   ../klipper-modified/ (hybrid_corexy_ratrig, idex_modes)             -> plain corexy

