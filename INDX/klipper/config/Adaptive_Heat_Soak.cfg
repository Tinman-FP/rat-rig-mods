# - INDX conversion draft (2026-11-06, Claude/Anthropic): DRAFT for review; not installed, not run.
# INDX: AHS_BEACON_SETTLE (Beacon drift wait) removed with the Beacons.
[gcode_macro _AHS_STATE]
variable_enable: 1
variable_quality: 3
variable_first_layer_minutes: 30.0
variable_min_minutes: 0.0
variable_max_minutes: 45.0
variable_hot_restart_min_minutes: 0.0
variable_bed_weight: 0.55
variable_chamber_weight: 0.45
variable_thermal_mass: 1.25
variable_planned_minutes: 0.0
variable_last_demand: 0.0
variable_last_readiness: 0.0
variable_last_similarity: 0.0
gcode:

[gcode_macro AHS_CAPTURE_HISTORY]
description: Save the current thermal snapshot for the next adaptive soak decision.
gcode:
  {% set chamber_enabled = 1 if printer["heater_generic chamber_heater1"] is defined and printer["heater_generic chamber_heater2"] is defined else 0 %}
  {% set chamber_actual = ((printer["heater_generic chamber_heater1"].temperature|float) + (printer["heater_generic chamber_heater2"].temperature|float)) / 2.0 if chamber_enabled else 0.0 %}
  {% set chamber_target = ((printer["heater_generic chamber_heater1"].target|float) + (printer["heater_generic chamber_heater2"].target|float)) / 2.0 if chamber_enabled else 0.0 %}
  SAVE_VARIABLE VARIABLE=ahs_last_bed_temp VALUE={printer.heater_bed.temperature|float}
  SAVE_VARIABLE VARIABLE=ahs_last_bed_target VALUE={printer.heater_bed.target|float}
  SAVE_VARIABLE VARIABLE=ahs_last_chamber_temp VALUE={chamber_actual}
  SAVE_VARIABLE VARIABLE=ahs_last_chamber_target VALUE={chamber_target}
  SAVE_VARIABLE VARIABLE=ahs_last_hotend_temp VALUE={printer.extruder.temperature|float if printer.extruder is defined else 0.0}
  SAVE_VARIABLE VARIABLE=ahs_last_hotend_target VALUE={printer.extruder.target|float if printer.extruder is defined else 0.0}

[gcode_macro AHS_PLAN]
description: Plan an adaptive soak using current thermal state and the previous thermal snapshot.
gcode:
  {% set adaptive = params.ADAPTIVE|default(printer["gcode_macro _AHS_STATE"].enable)|int %}
  {% set fixed_minutes = params.FIXED_MINUTES|default(-1)|float %}
  {% set bed = params.BED|default(0)|float %}
  {% set chamber = params.CHAMBER|default(0)|float %}
  {% set quality = params.QUALITY|default(printer["gcode_macro _AHS_STATE"].quality)|int %}
  {% set first_layer_minutes = params.FIRST_LAYER_MINUTES|default(printer["gcode_macro _AHS_STATE"].first_layer_minutes)|float %}
  {% set min_minutes = printer["gcode_macro _AHS_STATE"].min_minutes|float %}
  {% set max_minutes = printer["gcode_macro _AHS_STATE"].max_minutes|float %}
  {% set hot_restart_min = printer["gcode_macro _AHS_STATE"].hot_restart_min_minutes|float %}
  {% set bed_weight = printer["gcode_macro _AHS_STATE"].bed_weight|float %}
  {% set chamber_weight = printer["gcode_macro _AHS_STATE"].chamber_weight|float %}
  {% set thermal_mass = printer["gcode_macro _AHS_STATE"].thermal_mass|float %}
  {% set chamber_enabled = 1 if chamber > 0 and printer["heater_generic chamber_heater1"] is defined and printer["heater_generic chamber_heater2"] is defined else 0 %}
  {% set weight_total = bed_weight + (chamber_weight if chamber_enabled else 0.0) %}
  {% set bed_start = printer.heater_bed.temperature|float %}
  {% set chamber_start = ((printer["heater_generic chamber_heater1"].temperature|float) + (printer["heater_generic chamber_heater2"].temperature|float)) / 2.0 if chamber_enabled else 0.0 %}
  {% set history = printer.save_variables.variables %}
  {% set last_bed_target = history.ahs_last_bed_target|default(0.0)|float %}
  {% set last_chamber_target = history.ahs_last_chamber_target|default(0.0)|float %}
  {% set quality_factor = 0.65 if quality <= 1 else (0.85 if quality == 2 else (1.0 if quality == 3 else (1.2 if quality == 4 else 1.4))) %}
  {% set flm = 5.0 if first_layer_minutes < 5.0 else (90.0 if first_layer_minutes > 90.0 else first_layer_minutes) %}
  {% set layer_factor = 0.8 + ((flm / 90.0) * 0.7) %}
  {% set bed_factor = 0.0 if bed <= 30.0 else (1.0 if bed >= 130.0 else ((bed - 30.0) / 100.0)) %}
  {% set chamber_factor = 0.0 if chamber <= 0.0 else (1.0 if chamber >= 90.0 else (chamber / 90.0)) %}
  {% set bed_ready = 1.0 if bed <= 0.0 else (0.0 if bed_start <= 0.0 else (1.0 if bed_start >= bed else (bed_start / bed))) %}
  {% set chamber_ready = 1.0 if chamber <= 0.0 else (0.0 if chamber_start <= 0.0 else (1.0 if chamber_start >= chamber else (chamber_start / chamber))) %}
  {% set bed_similarity = 1.0 if bed <= 0.0 else (0.0 if last_bed_target <= 0.0 else (0.0 if ((last_bed_target - bed)|abs) >= bed else (1.0 - (((last_bed_target - bed)|abs) / bed)))) %}
  {% set chamber_similarity = 1.0 if chamber <= 0.0 else (0.0 if last_chamber_target <= 0.0 else (0.0 if ((last_chamber_target - chamber)|abs) >= chamber else (1.0 - (((last_chamber_target - chamber)|abs) / chamber)))) %}
  {% set demand = ((bed_factor * bed_weight) + ((chamber_factor * chamber_weight) if chamber_enabled else 0.0)) / weight_total %}
  {% set readiness = ((bed_ready * bed_weight) + ((chamber_ready * chamber_weight) if chamber_enabled else 0.0)) / weight_total %}
  {% set similarity = ((bed_similarity * bed_weight) + ((chamber_similarity * chamber_weight) if chamber_enabled else 0.0)) / weight_total %}
  {% if fixed_minutes >= 0.0 %}
    {% set planned = fixed_minutes %}
  {% elif adaptive == 0 or (bed <= 0.0 and chamber <= 0.0) %}
    {% set planned = 0.0 %}
  {% else %}
    {% set base_minutes = (2.0 + (demand * 12.0)) * quality_factor * layer_factor * thermal_mass %}
    {% set planned = base_minutes * (1.0 - (0.85 * readiness * similarity)) %}
    {% if readiness >= 0.92 and similarity >= 0.75 %}
      {% set planned = hot_restart_min %}
    {% endif %}
  {% endif %}
  {% if planned < min_minutes %}
    {% set planned = min_minutes %}
  {% endif %}
  {% if planned > max_minutes %}
    {% set planned = max_minutes %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_AHS_STATE VARIABLE=planned_minutes VALUE={planned}
  SET_GCODE_VARIABLE MACRO=_AHS_STATE VARIABLE=last_demand VALUE={demand}
  SET_GCODE_VARIABLE MACRO=_AHS_STATE VARIABLE=last_readiness VALUE={readiness}
  SET_GCODE_VARIABLE MACRO=_AHS_STATE VARIABLE=last_similarity VALUE={similarity}
  RESPOND TYPE=command MSG="AHS plan: bed_start={('%.1f'|format(bed_start))}C chamber_start={('%.1f'|format(chamber_start))}C target_bed={('%.1f'|format(bed))}C target_chamber={('%.1f'|format(chamber))}C demand={('%.2f'|format(demand))} readiness={('%.2f'|format(readiness))} similarity={('%.2f'|format(similarity))} planned={('%.2f'|format(planned))} min"

[gcode_macro AHS_HOLD]
description: Execute the planned adaptive soak hold.
gcode:
  {% set planned = printer["gcode_macro _AHS_STATE"].planned_minutes|float %}
  {% if planned > 0.05 %}
    RESPOND TYPE=command MSG="AHS hold: waiting {('%.2f'|format(planned))} min"
    G4 P{(planned * 60.0 * 1000.0)|int}
  {% else %}
    RESPOND TYPE=command MSG="AHS hold: skipped (machine already warm / similar to previous print)"
  {% endif %}


