#####################################################################
#  V-Core 4.1 INDX: tool positions and settings. DRAFT for review; not installed, not run.
#
#  This is Bondtech's macros/indx.cfg (github.com/BondtechAB/INDX, GPL-3.0, commit ae64179)
#  with this machine's values. It is the only Bondtech file that changes; include it in
#  place of their indx.cfg. This file is GPL-3.0 as well.
#
#  This machine (CAD: cad/.../source/vc12_params.py; printer X = CAD X + 255):
#    - five tools at the FRONT, 122 mm apart: X -20, 102, 224, 346, 468, seated at Y -40.0
#    - clearance_y 0.0: 40 mm behind the docked nozzles, because Bondtech's radial-cooling
#      ducts need more than their default 26
#    - Z probes on T0 at the bed centre, X 255, Y 242
#  The positions are CAD values. Measure every dock (CAL_SET_DOCK_Y, CALIBRATE_DOCK_X TOOL=n),
#  paste the results here, then set docks_calibrated: True and RESTART. Until then INDX
#  refuses anything that drives into a dock.
#####################################################################

[gcode_macro TOOL_POSITIONS]
description: INDX tool positions (user-configurable)

# ── How many tools are installed ─────────────────────────────────────────────
variable_tool_count: 5

# ── Z-hop during toolchange ──────────────────────────────────────────────────
#  z_hop = distance (mm) to raise Z before the toolhead travels to the dock.
#          Z clears first and lands before any XY movement starts, and on the
#          way back Z only drops once XY has reached the clearance line. Those
#          are separate moves on purpose: running Z and XY together raises or
#          lowers the nozzle gradually across the travel, which drags it over
#          the print at both ends of the change.
#          Set to 0.0 to disable.
variable_z_hop: 1.0

# ── Z offset auto-calibration probe position ─────────────────────────────────
#  Used by CAL_Z_AUTO_ALL to probe each tool and calibrate Z offsets.
#
#  probe_x / probe_y  — centre of the probing area (machine coords, mm).
#                       Set to the centre of your bed. The macro will probe
#                       here for debris clearing, then +5 mm in X for the
#                       actual measurement.
#  probe_fuzz         — legacy fuzz radius, kept for compatibility (mm).
#  probe_z_clearance  — Z height (gcode space) the toolhead travels to before
#                       descending to probe. Must clear any bed features.
variable_probe_x:          255.0  # bed centre X (PEI X 0..510)
variable_probe_y:          242.0  # bed centre Y (PEI Y 0..484.5)
variable_probe_fuzz:         2.0
variable_probe_z_clearance: 10.0

# ── Homing move speeds ───────────────────────────────────────────────
#  These cover only the moves the homing override makes itself: the step
#  aside to clearance_y before X is homed, the Z hop, the travel to the
#  probe point, and the lift afterwards.
#
#  The homing passes themselves are plain G28 X / G28 Y / G28 Z, so Klipper
#  applies whatever homing_speed, second_homing_speed, homing_retract_dist
#  and homing_positive_dir are set on your steppers. Nothing here overrides
#  those, and they do not need repeating.
#
#  home_travel_feedrate = mm/min for the XY moves listed above.
#  home_z_feedrate      = mm/min for the Z hop and the post-probe lift.
#                         Lower this for a slow leadscrew.
variable_home_travel_feedrate: 3000
variable_home_z_feedrate:       900

# ── Homing seat check ────────────────────────────────────────────────────────
#  home_check_seat = ask the load cell whether a tool is seated before G28 Z.
#                    Opt-in, and off by default.
#
#                    The load cell is a reliable contact detector, which is what
#                    probing needs, and an unreliable scale, which is what this
#                    check needs. Its absolute reading in grams moves with the
#                    tare, and a head tared with a tool already in it reads near
#                    zero with that tool still seated. Turning this on means a
#                    bad reading can refuse a homing that would have been fine.
#                    Leaving it off means INDX trusts active_tool instead, which
#                    is what every other tool-change operation already trusts.
#
#                    Either way the load cell is still the Z probe. This setting
#                    only decides whether its absolute reading gates homing.
#
#                    Write True or False, capitalised: Klipper parses these as
#                    Python literals and a lower-case true is a startup error.
variable_home_check_seat: False

#  home_min_force_g = grams the load cell must show before G28 Z.
#                     Only used when home_check_seat is True.
#                     Empty head sits well below this.
#                     Raise if an empty head is accepted as seated;
#                     lower only if a seated tool is refused.
variable_home_min_force_g: 800.0

# ── Pickup and park checks ───────────────────────────────────────────────────
#  seat_check_enabled = check every pickup and every park with the load cell.
#                       On by default. Each check compares two readings taken
#                       standing still seconds apart, so the tare and the
#                       load cell's drift do not matter, unlike home_check_seat.
#                       With no calibrated load cell the checks are skipped
#                       with one console line. Set False to turn them off.
#                       Write True or False, capitalised.
#
#                       Pickup: the reading after the pickup must differ from
#                       the empty head before it by seat_min_force_g. If not,
#                       X/Y is re-homed and the tool picked up once more. If
#                       that fails too, a print pauses and anything else stops,
#                       with the heater off and no tool recorded. A reading
#                       between seat_empty_max_g and seat_min_force_g means
#                       something may be half seated on the head: no retry,
#                       the tool stays recorded, and it pauses or stops. G28 Z,
#                       CHANGE_TOOL and PARK_TOOL then refuse, also after a
#                       restart, until the head is checked by hand and
#                       MANUAL_TOOL_REMOVE or MANUAL_TOOL_SEAT TOOL=<n> is run.
#
#                       Park: the reading after the drop-off must differ from
#                       the seated one by park_min_change_g. If not, the tool
#                       is still on the head: INDX stops with the heater off
#                       and keeps the tool recorded as on the head.
variable_seat_check_enabled: True

#  seat_min_force_g  = grams a seated tool must show against the empty head.
#                      Seated tools show 1100 to 1900 g on the test machine.
#  seat_empty_max_g  = below this a failed pickup counts as an empty head.
#                      From here up to seat_min_force_g it counts as a tool
#                      that may be half seated, and INDX keeps it recorded.
#  park_min_change_g = grams the reading must change by when a tool is parked.
variable_seat_min_force_g: 680.0
variable_seat_empty_max_g: 230.0
variable_park_min_change_g: 425.0

# ── Dock approach direction ──────────────────────────────────────────────────
#  dock_dir = Y sign into the dock: -1 front (min Y), +1 rear (max Y).
#             Flips trigger line, unlock depths, peel, and the homing
#             X-clearance check relative to dock_y.
variable_dock_dir: -1

# ── Trigger offset ───────────────────────────────────────────────────────────
#  trigger_offset = distance (mm) from dock_y to the trigger line.
#                   trigger_y is auto-derived as: dock_y - dock_dir * trigger_offset
#                   Increase if the latch engages before the tool is fully seated;
#                   decrease if the toolhead overshoots the dock.
variable_trigger_offset: 5.0

# ── Safe lateral travel position ─────────────────────────────────────────────
#  clearance_y = Y coordinate where the toolhead clears ALL docked tools.
#                The toolhead moves here before any X travel between tools.
#                Set this to the Y position where no tool bodies are in the way.
#                It must be at least 26 mm from the most protruding dock
#                (a tool needs 25 mm, plus 1 mm margin), on the side away
#                from the docks (front docks: the highest tN_dock_y + 26 or
#                more). Homing and tool changes refuse to run otherwise.
variable_clearance_y: 0.0        # docks at -40: 40 mm clear, for the radial-cooling ducts

# ── Dock calibration ──────────────────────────────────────────────────────────
#  docks_calibrated = False until the dock positions below are measured on
#                     your printer. While False, INDX refuses everything that
#                     drives into a dock: tool changes, parking, and a G28
#                     that would have to fetch T0 (the positions below are
#                     placeholders, and driving into them can crash the head).
#                     To home before the docks are measured, put T0 on the
#                     head by hand and run MANUAL_TOOL_SEAT TOOL=0, then G28.
#                     After measuring every dock, set True and RESTART.
variable_docks_calibrated: False

# ── Per-tool positions ────────────────────────────────────────────────────────
#  x      = X coordinate of the tool holder centre (mm)
#  dock_y = Y coordinate where the tool is fully seated (mm)
#           Move further along dock_dir to seat the tool deeper.
#
#  To add a tool:    add a new pair of lines and increment tool_count above.
#  To remove a tool: delete its pair of lines and decrement tool_count above.
#
variable_t0_x:      -20.0     # CAD; measure with CALIBRATE_DOCK_X TOOL=0
variable_t0_dock_y: -40.0     # CAD; measure with CAL_SET_DOCK_Y
#
variable_t1_x:      102.0
variable_t1_dock_y: -40.0
#
variable_t2_x:      224.0
variable_t2_dock_y: -40.0
#
variable_t3_x:      346.0
variable_t3_dock_y: -40.0
#
variable_t4_x:      468.0
variable_t4_dock_y: -40.0

# ── Tools that must never be heated ──────────────────────────────────────────
#  no_heat_tools = list of tool numbers that carry no hotend: a pen, a cutter,
#                  a camera, anything that is not a printing tool. CHANGE_TOOL
#                  picks these up and parks them like any other tool but never
#                  turns the coil on for them, whatever temperature the slicer
#                  asks for. Leave empty if every tool prints.
#                  Example for a pen in dock 3:  variable_no_heat_tools: [3]
variable_no_heat_tools: []

# ── Assembled at startup from the variables above — do not edit ──────────────
variable_tools: []

gcode:

#####################################################################
#  TOOL SHORTCUT MACROS (T0–T4)
#####################################################################
#  Slicers send T0, T1, etc. to select tools. Each macro below
#  routes to CHANGE_TOOL, which validates the index against the
#  tools list above and errors cleanly if the tool doesn't exist.
#
#  variable_active is what Mainsail and Fluidd read to show the tool
#  buttons and mark the tool on the head. INDX keeps it up to date.
#
#  If you have more than 4 tools, add more entries following the
#  same pattern, including the variable_active line.
#
#  This machine: each passes TEMP= through to CHANGE_TOOL, then runs
#  AFTER_TOOL_CHANGE (below). The slicer's change-filament G-code does the same.
#####################################################################

[gcode_macro T0]
variable_active: False
gcode:
    CHANGE_TOOL TOOL=0 {rawparams}
    AFTER_TOOL_CHANGE TOOL=0
[gcode_macro T1]
variable_active: False
gcode:
    CHANGE_TOOL TOOL=1 {rawparams}
    AFTER_TOOL_CHANGE TOOL=1
[gcode_macro T2]
variable_active: False
gcode:
    CHANGE_TOOL TOOL=2 {rawparams}
    AFTER_TOOL_CHANGE TOOL=2
[gcode_macro T3]
variable_active: False
gcode:
    CHANGE_TOOL TOOL=3 {rawparams}
    AFTER_TOOL_CHANGE TOOL=3
[gcode_macro T4]
variable_active: False
gcode:
    CHANGE_TOOL TOOL=4 {rawparams}
    AFTER_TOOL_CHANGE TOOL=4

#####################################################################
#  This machine: after every tool change (T0..T4 and the slicer's change-filament G-code):
#    CHANGE_TOOL TOOL={next_extruder} TEMP={new_filament_temp}
#    AFTER_TOOL_CHANGE TOOL={next_extruder}
#    M400
#####################################################################

[gcode_macro AFTER_TOOL_CHANGE]
description: After a tool change: refresh the power-loss checkpoint (only while printing), then pause if the new tool has no filament. TOOL=n
gcode:
    {% set t = params.TOOL|int %}
    {% if printer.print_stats.state|string == "printing" %}
        # Only while printing: after a power cut a manual tool change must not overwrite the checkpoint
        PLR_SNAPSHOT QUIET=1
    {% endif %}
    _FS_AFTER_PICKUP TOOL={t}
