# INDX: the two-carriage jog tests (SEL_CAR*, CAR*_LEFT/RIGHT, FORCE_X_T1_*) removed; the chamber
# test logs the INDX board temperature instead of the toolboard fans. FORCE_X_T0_* now moves motor A
# only, which on CoreXY is a diagonal move.

# Test_Macros.cfg - Safe IDEX / axis test macros (fixed)
#####################################################################

# Enables FORCE_MOVE and SET_KINEMATIC_POSITION commands
[force_move]
enable_force_move: True


#####################################################################
# Lightweight sanity checks (Klipper-safe)
#####################################################################

[gcode_macro _ASSERT_CONNECTED]
gcode:
  {% if printer.idle_timeout is not defined %}
    RESPOND TYPE=error MSG="idle_timeout object missing (very unusual)."
  {% else %}
    {% if printer.idle_timeout.state|lower in ["printing", "ready", "idle"] %}
      ; ok
    {% else %}
      RESPOND TYPE=error MSG="Not in a usable state: idle_timeout.state={printer.idle_timeout.state}. If you see 'Disconnect', fix connection first."
      {% endif %}
  {% endif %}



#####################################################################
# Carriage selection (IDEX)
#####################################################################




#####################################################################
# Small X moves (requires X homed)
#####################################################################






#####################################################################
# Unhomed “bump” moves (FORCE_MOVE)
# Moves steppers directly, does NOT require homing.
#####################################################################

[gcode_macro FORCE_X_T0_PLUS]
gcode:
  _ASSERT_CONNECTED
  FORCE_MOVE STEPPER=stepper_x DISTANCE=5 VELOCITY=20 ACCEL=200

[gcode_macro FORCE_X_T0_MINUS]
gcode:
  _ASSERT_CONNECTED
  FORCE_MOVE STEPPER=stepper_x DISTANCE=-5 VELOCITY=20 ACCEL=200



[gcode_macro FORCE_Y_PLUS]
gcode:
  _ASSERT_CONNECTED
  FORCE_MOVE STEPPER=stepper_y DISTANCE=5 VELOCITY=20 ACCEL=200
  FORCE_MOVE STEPPER=stepper_y1 DISTANCE=5 VELOCITY=20 ACCEL=200

[gcode_macro FORCE_Y_MINUS]
gcode:
  _ASSERT_CONNECTED
  FORCE_MOVE STEPPER=stepper_y DISTANCE=-5 VELOCITY=20 ACCEL=200
  FORCE_MOVE STEPPER=stepper_y1 DISTANCE=-5 VELOCITY=20 ACCEL=200

#####################################################################
# Chamber Heater Test & Logging
#####################################################################

[gcode_macro _CHAMBER_TEST_STATE]
variable_active: 0
variable_interval: 10
variable_sample: 0
variable_start_epoch: 0
variable_safety_limit: 130.0
variable_note: '""'
gcode:

[delayed_gcode _CHAMBER_TEST_LOGGER]
initial_duration: 0
gcode:
  {% set st = printer["gcode_macro _CHAMBER_TEST_STATE"] %}
  {% if st.active|int == 1 %}
    {% set sample = st.sample|int + 1 %}
    SET_GCODE_VARIABLE MACRO=_CHAMBER_TEST_STATE VARIABLE=sample VALUE={sample}

    {% set bed = printer.heater_bed.temperature|float %}
    {% set bed_t = printer.heater_bed.target|float %}
    {% set c1 = printer["heater_generic chamber_heater1"].temperature|float %}
    {% set c1_t = printer["heater_generic chamber_heater1"].target|float %}
    {% set c2 = printer["heater_generic chamber_heater2"].temperature|float %}
    {% set c2_t = printer["heater_generic chamber_heater2"].target|float %}
    {% set s1 = printer["temperature_sensor chamber1_safety"].temperature|float %}
    {% set s2 = printer["temperature_sensor chamber2_safety"].temperature|float %}
    {% set cool = printer["fan_generic chamber_cooling_fan"].speed|float %}
    {% set ctrl = printer["fan_generic controller_fan"].speed|float %}
    {% set hb = printer["temperature_sensor INDX_board"].temperature|float %}
    {% set he2 = printer["fan_generic hp_fan_he2"].speed|float if printer["fan_generic hp_fan_he2"] is defined else 0.0 %}
    {% set ch1f = printer["heater_fan chamber1_fan"].speed|float if printer["heater_fan chamber1_fan"] is defined else 0.0 %}
    {% set ch2f = printer["heater_fan chamber2_fan"].speed|float if printer["heater_fan chamber2_fan"] is defined else 0.0 %}
    {% set note = st.note|string %}
    RESPOND TYPE=command MSG="CHAMBER_TEST sample={sample} note={note} bed={'%.1f'|format(bed)}/{ '%.1f'|format(bed_t)} c1={'%.1f'|format(c1)}/{ '%.1f'|format(c1_t)} c2={'%.1f'|format(c2)}/{ '%.1f'|format(c2_t)} s1={'%.1f'|format(s1)} s2={'%.1f'|format(s2)} cool={'%.2f'|format(cool)} ctrl={'%.2f'|format(ctrl)} indx_board={'%.1f'|format(hb)} he2={'%.2f'|format(he2)} ch1f={'%.2f'|format(ch1f)} ch2f={'%.2f'|format(ch2f)}"

    {% if s1 >= st.safety_limit|float or s2 >= st.safety_limit|float %}
      RESPOND TYPE=error MSG="CHAMBER_TEST safety limit hit; stopping test"
      CHAMBER_TEST_STOP BED_OFF=1 NOTE='safety_limit'
    {% else %}
      UPDATE_DELAYED_GCODE ID=_CHAMBER_TEST_LOGGER DURATION={st.interval|float}
    {% endif %}
  {% endif %}

[gcode_macro CHAMBER_TEST_START]
description: Start chamber heating test logging. Params: BED=100 CHAMBER=55 INTERVAL=10 SAFETY=130 NOTE=phase1
gcode:
  {% set bed = params.BED|default(100)|float %}
  {% set chamber = params.CHAMBER|default(55)|float %}
  {% set interval = params.INTERVAL|default(10)|float %}
  {% set safety = params.SAFETY|default(130)|float %}
  {% set note = params.NOTE|default("start")|string %}
  SET_GCODE_VARIABLE MACRO=_CHAMBER_TEST_STATE VARIABLE=active VALUE=1
  SET_GCODE_VARIABLE MACRO=_CHAMBER_TEST_STATE VARIABLE=interval VALUE={interval}
  SET_GCODE_VARIABLE MACRO=_CHAMBER_TEST_STATE VARIABLE=sample VALUE=0
  SET_GCODE_VARIABLE MACRO=_CHAMBER_TEST_STATE VARIABLE=safety_limit VALUE={safety}
  SET_GCODE_VARIABLE MACRO=_CHAMBER_TEST_STATE VARIABLE=note VALUE='"{note}"'
  RESPOND TYPE=command MSG="CHAMBER_TEST start bed={bed} chamber={chamber} interval={interval}s safety={safety} note={note}"
  CHAMBER_COOL_OFF
  CONTROLLER_FAN_ON
  HPFAN_ON
  SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed}
  CHAMBER_HEAT S={chamber}
  UPDATE_DELAYED_GCODE ID=_CHAMBER_TEST_LOGGER DURATION=1

[gcode_macro CHAMBER_TEST_SET]
description: Adjust chamber test targets during a run. Params: BED=<optional> CHAMBER=<optional> NOTE=<optional>
gcode:
  {% set note = params.NOTE|default("set")|string %}
  {% if params.BED is defined %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={params.BED|float}
  {% endif %}
  {% if params.CHAMBER is defined %}
    CHAMBER_HEAT S={params.CHAMBER|float}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_CHAMBER_TEST_STATE VARIABLE=note VALUE='"{note}"'
  RESPOND TYPE=command MSG="CHAMBER_TEST set note={note} bed_target={printer.heater_bed.target|float} chamber1_target={printer['heater_generic chamber_heater1'].target|float} chamber2_target={printer['heater_generic chamber_heater2'].target|float}"
  UPDATE_DELAYED_GCODE ID=_CHAMBER_TEST_LOGGER DURATION=0.1

[gcode_macro CHAMBER_TEST_NOTE]
description: Add a named marker to the chamber test log. Params: NOTE=phase2
gcode:
  {% set note = params.NOTE|default("mark")|string %}
  SET_GCODE_VARIABLE MACRO=_CHAMBER_TEST_STATE VARIABLE=note VALUE='"{note}"'
  RESPOND TYPE=command MSG="CHAMBER_TEST note={note}"
  UPDATE_DELAYED_GCODE ID=_CHAMBER_TEST_LOGGER DURATION=0.1

[gcode_macro CHAMBER_TEST_SNAPSHOT]
description: Log a single chamber test snapshot without changing state
gcode:
  UPDATE_DELAYED_GCODE ID=_CHAMBER_TEST_LOGGER DURATION=0.1

[gcode_macro CHAMBER_TEST_STOP]
description: Stop chamber test logging and restore automatic fan control. Params: BED_OFF=1 NOTE=done
gcode:
  {% set bed_off = params.BED_OFF|default(1)|int %}
  {% set note = params.NOTE|default("stop")|string %}
  SET_GCODE_VARIABLE MACRO=_CHAMBER_TEST_STATE VARIABLE=active VALUE=0
  SET_GCODE_VARIABLE MACRO=_CHAMBER_TEST_STATE VARIABLE=note VALUE='"{note}"'
  UPDATE_DELAYED_GCODE ID=_CHAMBER_TEST_LOGGER DURATION=0
  CHAMBER_OFF
  {% if bed_off == 1 %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
  {% endif %}
  CHAMBER_COOL_AUTO
  CONTROLLER_FAN_AUTO
  HPFAN_AUTO_ENABLE
  RESPOND TYPE=command MSG="CHAMBER_TEST stop note={note} bed_off={bed_off}"
