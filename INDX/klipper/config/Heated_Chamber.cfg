# Heated_Chamber.cfg (CONSOLIDATED)
#####################################################################

# INDX: the filament sensors moved to Filament_Sensors.cfg (one runout switch per tool).
# The Smart Head is rated for 60 C ambient (Bondtech's sheet), so chamber targets are capped
# below that: _CHAMBER_LIMITS.

[gcode_macro _CHAMBER_LIMITS]
variable_max_target: 55.0    # C. INDX Smart Head: 60 C ambient at most; 5 C margin for the air at the head
gcode:

[heater_generic chamber_heater1]
heater_pin: PA8 # Fan 0
sensor_type: Generic 3950
sensor_pin: PF6 # T2
min_temp: 0
max_temp: 85
gcode_id: C1

[heater_generic chamber_heater2]
heater_pin: PE5 # Fan 1
sensor_type: Generic 3950
sensor_pin: PF7 # T3
min_temp: 0
max_temp: 80
gcode_id: C2



[verify_heater chamber_heater1]
check_gain_time: 300
heating_gain: 0.5
hysteresis: 10
max_error: 300

[verify_heater chamber_heater2]
check_gain_time: 300
heating_gain: 0.5
hysteresis: 10
max_error: 300

[temperature_sensor chamber1_safety]
sensor_type: Generic 3950
sensor_pin: PF4 # T0
min_temp: 0
max_temp: 150

[temperature_sensor chamber2_safety]
sensor_type: Generic 3950
sensor_pin: PF5 # T1
min_temp: 0
max_temp: 150


[heater_fan chamber1_fan]
pin: PD15 # Fan 5
heater: chamber_heater1
heater_temp: 30.0
fan_speed: 1.0

[heater_fan chamber2_fan]
pin: PD14 # Fan 4
heater: chamber_heater2
heater_temp: 30.0
fan_speed: 1.0


[fan_generic chamber_cooling_fan]
pin: PD13
max_power: 1.0
shutdown_speed: 0
kick_start_time: 0.5
off_below: 0.05

[gcode_macro _CHAMBER_COOL_STATE]
variable_manual: 0
variable_speed: 1.0
variable_on_temp: 35.0
variable_off_temp: 32.0
variable_force_temp: 90.0
gcode:

[delayed_gcode _chamber_cool_auto]
initial_duration: 5
gcode:
  {% set st = printer["gcode_macro _CHAMBER_COOL_STATE"] %}
  {% if st.manual|int == 0 %}
    {% set on_t = st.on_temp|float %}
    {% set off_t = st.off_temp|float %}
    {% set force_t = st.force_temp|float %}
    {% set speed = st.speed|float %}

    {% set c1 = printer["heater_generic chamber_heater1"].temperature|float %}
    {% set c2 = printer["heater_generic chamber_heater2"].temperature|float %}
    {% set cmax = c1 if c1 > c2 else c2 %}

    {% set t1 = printer["heater_generic chamber_heater1"].target|float %}
    {% set t2 = printer["heater_generic chamber_heater2"].target|float %}
    {% set heaters_on = (t1 > 0) or (t2 > 0) %}
    {% set heating_to_target = ((t1 > 0) and (c1 < t1)) or ((t2 > 0) and (c2 < t2)) %}

    {% set s1 = printer["temperature_sensor chamber1_safety"].temperature|float %}
    {% set s2 = printer["temperature_sensor chamber2_safety"].temperature|float %}
    {% set force = (s1 >= force_t) or (s2 >= force_t) %}

    {% if force %}
      SET_FAN_SPEED FAN=chamber_cooling_fan SPEED=1.0
    {% elif heating_to_target %}
      SET_FAN_SPEED FAN=chamber_cooling_fan SPEED=0
    {% elif heaters_on %}
      {% if cmax >= on_t %}
        SET_FAN_SPEED FAN=chamber_cooling_fan SPEED={speed}
      {% elif cmax <= off_t %}
        SET_FAN_SPEED FAN=chamber_cooling_fan SPEED=0
      {% endif %}
    {% else %}
      {% if cmax >= on_t %}
        SET_FAN_SPEED FAN=chamber_cooling_fan SPEED={speed}
      {% elif cmax <= off_t %}
        SET_FAN_SPEED FAN=chamber_cooling_fan SPEED=0
      {% endif %}
    {% endif %}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_chamber_cool_auto DURATION=5


[gcode_macro CHAMBER_COOL_AUTO]
gcode:
  SET_GCODE_VARIABLE MACRO=_CHAMBER_COOL_STATE VARIABLE=manual VALUE=0
  UPDATE_DELAYED_GCODE ID=_chamber_cool_auto DURATION=1

[gcode_macro CHAMBER_COOL_ON]
gcode:
  {% set s = params.SPEED|default(printer["gcode_macro _CHAMBER_COOL_STATE"].speed)|float %}
  SET_GCODE_VARIABLE MACRO=_CHAMBER_COOL_STATE VARIABLE=manual VALUE=1
  SET_GCODE_VARIABLE MACRO=_CHAMBER_COOL_STATE VARIABLE=speed VALUE={s}
  SET_FAN_SPEED FAN=chamber_cooling_fan SPEED={s}

[gcode_macro CHAMBER_COOL_OFF]
gcode:
  SET_GCODE_VARIABLE MACRO=_CHAMBER_COOL_STATE VARIABLE=manual VALUE=1
  SET_FAN_SPEED FAN=chamber_cooling_fan SPEED=0


[fan_generic controller_fan]
pin: PD12
max_power: 1.0
shutdown_speed: 0
kick_start_time: 0.5
off_below: 0.05

[gcode_macro _CONTROLLER_FAN_STATE]
variable_manual: 0
gcode:

[delayed_gcode _controller_fan_auto]
initial_duration: 1
gcode:
  {% if printer["gcode_macro _CONTROLLER_FAN_STATE"].manual|int == 0 %}
    {% set printing = printer.print_stats.state|string == "printing" %}
    {% set bed_target = printer.heater_bed.target|float if printer.heater_bed is defined else 0.0 %}
    {% set t0_target = printer.extruder.target|float if printer.extruder is defined else 0.0 %}
    {% set c1_target = printer["heater_generic chamber_heater1"].target|float if printer["heater_generic chamber_heater1"] is defined else 0.0 %}
    {% set c2_target = printer["heater_generic chamber_heater2"].target|float if printer["heater_generic chamber_heater2"] is defined else 0.0 %}
    {% if printing or bed_target > 0.0 or t0_target > 0.0 or c1_target > 0.0 or c2_target > 0.0 %}
      SET_FAN_SPEED FAN=controller_fan SPEED=1.0
    {% else %}
      SET_FAN_SPEED FAN=controller_fan SPEED=0
    {% endif %}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_controller_fan_auto DURATION=1

[gcode_macro CONTROLLER_FAN_ON]
gcode:
  SET_GCODE_VARIABLE MACRO=_CONTROLLER_FAN_STATE VARIABLE=manual VALUE=1
  SET_FAN_SPEED FAN=controller_fan SPEED=1.0

[gcode_macro CONTROLLER_FAN_OFF]
gcode:
  SET_GCODE_VARIABLE MACRO=_CONTROLLER_FAN_STATE VARIABLE=manual VALUE=1
  SET_FAN_SPEED FAN=controller_fan SPEED=0

[gcode_macro CONTROLLER_FAN_AUTO]
gcode:
  SET_GCODE_VARIABLE MACRO=_CONTROLLER_FAN_STATE VARIABLE=manual VALUE=0
  UPDATE_DELAYED_GCODE ID=_controller_fan_auto DURATION=1

[gcode_macro CHAMBER_HEAT]
description: Set both chamber heaters to the same target (S or TARGET)
gcode:
  {% set req = params.S|default(params.TARGET|default(0))|float %}
  {% set cap = printer["gcode_macro _CHAMBER_LIMITS"].max_target|float %}
  {% set t = cap if req > cap else req %}
  {% if req > cap %}
    RESPOND TYPE=error MSG="Chamber target {'%.1f'|format(req)}C capped to {'%.1f'|format(cap)}C (INDX head limit)"
  {% endif %}
  SET_HEATER_TEMPERATURE HEATER=chamber_heater1 TARGET={t}
  SET_HEATER_TEMPERATURE HEATER=chamber_heater2 TARGET={t}
  RESPOND MSG="Chamber heaters set to {'%.1f'|format(t)}C"

[gcode_macro CHAMBER_OFF]
description: Turn both chamber heaters off
gcode:
  CHAMBER_HEAT S=0

[gcode_macro M141]
description: Chamber set temp compatibility (maps to CHAMBER_HEAT)
gcode:
  {% set t = params.S|default(0)|float %}
  CHAMBER_HEAT S={t}

[gcode_macro M191]
description: Chamber set and wait compatibility (waits for both heaters)
gcode:
  {% set req = params.S|default(0)|float %}
  {% set cap = printer["gcode_macro _CHAMBER_LIMITS"].max_target|float %}
  {% set t = cap if req > cap else req %}
  CHAMBER_HEAT S={req}
  TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater1" MINIMUM={t - 0.5}
  TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater2" MINIMUM={t - 0.5}
