[gcode_macro OPS_MAINTENANCE_CHECK]
description: "Maintenance reminder by print count. Usage: OPS_MAINTENANCE_CHECK EVERY=100"
gcode:
  {% set every = params.EVERY|default(100)|int %}
  {% set vars = printer.save_variables.variables %}
  {% set n = vars.ops_print_count|default(0)|int %}
  {% if every > 0 and n > 0 and (n % every) == 0 %}
    RESPOND TYPE=error MSG="Maintenance due: print count reached {n} (interval {every})"
  {% else %}
    RESPOND MSG="Maintenance check OK: count={n}, interval={every}"
  {% endif %}

[gcode_macro START_PRINT_ADV]
description: "INDX start: prechecks for every tool used, home (Z on T0), heat soak, level and mesh on T0, then pick the first tool, heat it, prime and wipe"
gcode:
  SET_GCODE_VARIABLE MACRO=_LAYER_WIPE_STATE VARIABLE=count VALUE=-1
  OPS_COUNTER_START
  OPS_MAINTENANCE_CHECK
  RGB_HEATING
  {% set tool = params.TOOL|default(0)|int %}
  {% set tools_raw = params.TOOLS|default("auto")|string %}
  {% set bed = params.BED|default(params.BED_TEMP|default(60))|float %}
  {% set hotend = params.HOTEND|default(params.EXTRUDER|default(params.EXTRUDER_TEMP|default(200)))|float %}
  {% set chamber = params.CHAMBER|default(50)|float %}
  {% set soak = params.SOAK_MIN|default(5)|float %}
  {% set soak_explicit = params.SOAK_EXPLICIT|default(0)|int %}
  {% set adaptive_soak = params.ADAPTIVE_SOAK|default(printer["gcode_macro _AHS_STATE"].enable)|int %}
  {% set ahs_quality = params.AHS_QUALITY|default(printer["gcode_macro _AHS_STATE"].quality)|int %}
  {% set first_layer_minutes = params.FIRST_LAYER_MINUTES|default(printer["gcode_macro _AHS_STATE"].first_layer_minutes)|float %}
  {% set probe_count = params.PROBE_COUNT|default("7,7") %}
  {% set margin = params.MARGIN|default(8)|int %}
  {% set force_zt = params.FORCE_Z_TILT|default(0)|int %}
  {% set pre_probe_wipe = params.PRE_PROBE_WIPE|default(1)|int %}
  {% set pre_probe_wipe_count = params.PRE_PROBE_WIPE_COUNT|default(8)|int %}
  {% set prime = params.PRIME|default(8)|float %}
  {% set flt = printer["gcode_macro _FIRST_LAYER_TUNE_STATE"] %}
  M117 START_PRINT_ADV
  PRECHECK_REPORT TOOL={tool} TOOLS={tools_raw}
  PRECHECK_ENFORCE TOOL={tool} TOOLS={tools_raw} REQUIRE_HOMED=0
  # G28 homes Z on T0 (Bondtech): the head ends with T0 on it
  G28
  PLR_BEGIN_PRINT
  HEAT_SOAK_CALIBRATE BED={bed} CHAMBER={chamber} SOAK_MIN={soak} SOAK_EXPLICIT={soak_explicit} ADAPTIVE={adaptive_soak} QUALITY={ahs_quality} FIRST_LAYER_MINUTES={first_layer_minutes}
  RGB_LEVELING
  G28 Z
  {% if pre_probe_wipe == 1 %}
    # T0 is the probe: wipe it (cold) on its own pad first
    CLEAN_NOZZLE TOOL=0 COUNT={pre_probe_wipe_count}
  {% endif %}
  {% if flt.enabled|int == 1 %}
    M220 S{flt.speed_percent|int}
    RESPOND TYPE=command MSG="FIRST_LAYER_TUNE active: speed={flt.speed_percent|int}% for first {flt.layers|int} layer(s)."
  {% endif %}
  ADAPTIVE_MESH PROBE_COUNT={probe_count} MARGIN={margin} FORCE_Z_TILT={force_zt}
  PLR_SNAPSHOT LAYER=0 QUIET=1
  PRECHECK_ENFORCE TOOL={tool} TOOLS={tools_raw} REQUIRE_HOMED=1
  # Heat only after the first tool is on the head (INDX's M104/M109 refuse an empty head)
  T{tool} TEMP={hotend}
  M104 S{hotend}
  M109 S{hotend}
  PURGE_AND_WIPE TOOL={tool} LENGTH={prime}
  {% if flt.enabled|int == 1 and flt.extra_wipe|int == 1 %}
    CLEAN_NOZZLE TOOL={tool} COUNT={flt.wipe_count|int}
  {% endif %}
  RGB_PRINTING
  TOOLING_STATUS_REFRESH

[gcode_macro PRINTER_HEALTH]
description: "Report core temps, targets, fans, homing, and tool state"
gcode:
  {% set h = printer.toolhead.homed_axes|string %}
  {% set svv = printer.save_variables.variables %}
  {% set act = svv.active_tool|default(-1)|int %}
  {% set ext = printer.extruder.temperature|float %}
  {% set ext_t = printer.extruder.target|float %}
  {% set bed = printer.heater_bed.temperature|float %}
  {% set bed_t = printer.heater_bed.target|float %}
  {% set c1 = printer["heater_generic chamber_heater1"].temperature|float %}
  {% set c1_t = printer["heater_generic chamber_heater1"].target|float %}
  {% set c2 = printer["heater_generic chamber_heater2"].temperature|float %}
  {% set c2_t = printer["heater_generic chamber_heater2"].target|float %}
  {% set hb = printer["temperature_sensor INDX_board"].temperature|float %}
  {% set f0 = printer.fan.speed|float %}
  {% set fc = printer["fan_generic chamber_cooling_fan"].speed|float %}
  {% set fctrl = printer["fan_generic controller_fan"].speed|float %}
  RESPOND MSG="Homed={h} Tool on head={'T%d' % act if act >= 0 else 'none'} toolchanges={svv.toolchange_count|default(0)}"
  RESPOND MSG="Nozzle={'%.1f'|format(ext)}/{'%.1f'|format(ext_t)}C  Bed={'%.1f'|format(bed)}/{'%.1f'|format(bed_t)}C  INDX board={'%.1f'|format(hb)}C"
  RESPOND MSG="Chamber1={'%.1f'|format(c1)}/{'%.1f'|format(c1_t)}C  Chamber2={'%.1f'|format(c2)}/{'%.1f'|format(c2_t)}C"
  RESPOND MSG="Fans part={'%.2f'|format(f0)} ChamberCool={'%.2f'|format(fc)} Controller={'%.2f'|format(fctrl)}"
  OPS_COUNTER_STATUS

[gcode_macro SENSOR_STATUS]
description: "Report filament sensors, chamber safety thermistors and the INDX head temperatures"
gcode:
  {% set s1 = printer["temperature_sensor chamber1_safety"].temperature|float %}
  {% set s2 = printer["temperature_sensor chamber2_safety"].temperature|float %}
  {% set hb = printer["temperature_sensor INDX_board"].temperature|float %}
  {% set hk = printer["temperature_sensor INDX_bracket"].temperature|float %}
  FILAMENT_STATUS
  RESPOND MSG="Chamber safety temps: C1={'%.1f'|format(s1)}C C2={'%.1f'|format(s2)}C  INDX board={'%.1f'|format(hb)}C bracket={'%.1f'|format(hk)}C"

[gcode_macro SAFE_STOP_ALL]
description: "Immediate safe stop: heaters off, print fan off, chamber heaters off"
gcode:
  TURN_OFF_HEATERS
  CHAMBER_OFF
  CHAMBER_COOL_AUTO
  CONTROLLER_FAN_AUTO
  M107
  RESPOND TYPE=error MSG="SAFE_STOP_ALL executed"

[delayed_gcode _STARTUP_DEFAULTS]
initial_duration: 1.0
gcode:
  CONTROLLER_FAN_AUTO
  HPFAN_AUTO_ENABLE
  CHAMBER_LIGHT_ON
  RGB_READY
  DETECT_INTERRUPTION
  RESPOND TYPE=command MSG="STARTUP_DEFAULTS: controller/HE2 fan auto enabled, chamber light set to 100%."

[gcode_macro PRECHECK_REPORT]
description: "Read-only readiness report (does not stop). Params: TOOL=0..4 TOOLS=auto|0,2,3|true,false,..."
gcode:
  {% set tool = params.TOOL|default(0)|int %}
  {% set chamber_limit = params.CHAMBER_LIMIT|default(130.0)|float %}
  {% set raw = params.TOOLS|default("auto")|string|lower|replace(" ", "")|replace('"', '') %}
  {% set ns = namespace(tools=[]) %}
  {% set parts = raw.split(",") if raw not in ["", "auto"] else [] %}
  {% if parts|length == 5 and parts|reject("in", ["true", "false", "1", "0"])|list|length == 0 %}
    {% for i in range(5) %}
      {% if parts[i] in ["true", "1"] %}{% set ns.tools = ns.tools + [i] %}{% endif %}
    {% endfor %}
  {% else %}
    {% for p in parts %}
      {% if p|int(-1) >= 0 and p|int(-1) <= 4 and p|int not in ns.tools %}{% set ns.tools = ns.tools + [p|int] %}{% endif %}
    {% endfor %}
  {% endif %}
  {% if tool not in ns.tools %}{% set ns.tools = [tool] + ns.tools %}{% endif %}
  {% set tools = ns.tools %}
  {% set hs = printer.toolhead.homed_axes|string %}
  {% set c1 = printer["temperature_sensor chamber1_safety"].temperature|float %}
  {% set c2 = printer["temperature_sensor chamber2_safety"].temperature|float %}
  {% set can_home = ("x" in hs and "y" in hs and "z" in hs) %}
  {% set fs = namespace(ok=True, txt="") %}
  {% for t in tools %}
    {% set s = printer["filament_switch_sensor T%d_runout" % t] %}
    {% set has = s.filament_detected if s is defined else False %}
    {% set fs.ok = fs.ok and has %}
    {% set fs.txt = fs.txt ~ "T%d=%s " % (t, has) %}
  {% endfor %}
  {% set chamber_ok = (c1 < chamber_limit) and (c2 < chamber_limit) %}
  RESPOND MSG="PRECHECK tool={tool} tools={tools} homed={can_home} filament_ok={fs.ok} chamber_ok={chamber_ok}"
  RESPOND MSG="Details: homed_axes={hs} filament {fs.txt}safety(C1={'%.1f'|format(c1)}C,C2={'%.1f'|format(c2)}C)"

[gcode_macro PRECHECK_ENFORCE]
description: "Hard precheck. Errors out on failed conditions. Params: TOOL=0..4 TOOLS=auto|0,2,3|true,false,... REQUIRE_HOMED=1 CHAMBER_LIMIT=130"
gcode:
  {% set tool = params.TOOL|default(0)|int %}
  {% set require_homed = params.REQUIRE_HOMED|default(1)|int %}
  {% set chamber_limit = params.CHAMBER_LIMIT|default(130.0)|float %}
  {% set raw = params.TOOLS|default("auto")|string|lower|replace(" ", "")|replace('"', '') %}
  {% set ns = namespace(tools=[]) %}
  {% set parts = raw.split(",") if raw not in ["", "auto"] else [] %}
  {% if parts|length == 5 and parts|reject("in", ["true", "false", "1", "0"])|list|length == 0 %}
    {% for i in range(5) %}
      {% if parts[i] in ["true", "1"] %}{% set ns.tools = ns.tools + [i] %}{% endif %}
    {% endfor %}
  {% else %}
    {% for p in parts %}
      {% if p|int(-1) >= 0 and p|int(-1) <= 4 and p|int not in ns.tools %}{% set ns.tools = ns.tools + [p|int] %}{% endif %}
    {% endfor %}
  {% endif %}
  {% if tool not in ns.tools %}{% set ns.tools = [tool] + ns.tools %}{% endif %}
  {% set tools = ns.tools %}
  {% set hs = printer.toolhead.homed_axes|string %}
  {% set c1 = printer["temperature_sensor chamber1_safety"].temperature|float %}
  {% set c2 = printer["temperature_sensor chamber2_safety"].temperature|float %}
  {% set svv = printer.save_variables.variables %}
  {% if tool < 0 or tool > 4 %}
    { action_raise_error("PRECHECK_FAIL: TOOL must be 0..4 (got %d)" % tool) }
  {% endif %}
  {% if require_homed == 1 and not ("x" in hs and "y" in hs and "z" in hs) %}
    { action_raise_error("PRECHECK_FAIL: axes not homed (homed_axes=%s)" % hs) }
  {% endif %}
  {% if svv.seat_suspect is defined and svv.seat_suspect|int >= 0 %}
    { action_raise_error("PRECHECK_FAIL: INDX flags T%d as maybe half seated: check the head, then MANUAL_TOOL_REMOVE or MANUAL_TOOL_SEAT" % svv.seat_suspect|int) }
  {% endif %}
  {% for t in tools %}
    {% set s = printer["filament_switch_sensor T%d_runout" % t] %}
    {% if s is defined and s.enabled and not s.filament_detected %}
      { action_raise_error("PRECHECK_FAIL: T%d runout sensor reports no filament" % t) }
    {% endif %}
  {% endfor %}
  {% if c1 >= chamber_limit or c2 >= chamber_limit %}
    { action_raise_error("PRECHECK_FAIL: chamber safety temp high (C1=%.1fC, C2=%.1fC)" % (c1, c2)) }
  {% endif %}
  RESPOND MSG="PRECHECK_PASS tool={tool} tools={tools}"

