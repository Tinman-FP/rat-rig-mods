#
# INDX conversion, what changed here:
#   - PLR macros moved to PLR.cfg (adapted to one carriage and the active tool).
#   - CLEAN_NOZZLE now lives in Stations.cfg (each tool's own pad); the old wipe-pad macros are gone.
#   - M106/M107 overrides removed: the INDX part-cooling output is a plain [fan].
#   - LOAD_FILAMENT is Bondtech's (heat model + feed). FILAMENT_LOAD wraps it over the tool's bucket.
#     The Apus-switch autoload (LOAD_FILAMENT_AUTO) is retired with the toolboard switches.
#   - START_PRINT_ADV: home and level on T0 (the load cell), then pick the first tool, then heat.
#   - Prechecks cover every tool the print uses (TOOLS=).
