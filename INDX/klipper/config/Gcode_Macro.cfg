[gcode_macro M486]
description: "Marlin object cancel compatibility"
gcode:
  {% if "exclude_object" not in printer %}
    RESPOND TYPE=error MSG="exclude_object is not enabled in config"
  {% else %}
    {% if 'T' in params %}
      EXCLUDE_OBJECT_DEFINE RESET=1
      {% for i in range(params.T|int) %}
        EXCLUDE_OBJECT_DEFINE NAME={i}
      {% endfor %}
    {% endif %}

    {% if 'C' in params %}
      EXCLUDE_OBJECT CURRENT=1
    {% endif %}

    {% if 'P' in params %}
      EXCLUDE_OBJECT NAME={params.P}
    {% endif %}

    {% if 'S' in params %}
      {% if params.S == '-1' %}
        EXCLUDE_OBJECT RESET=1
      {% else %}
        EXCLUDE_OBJECT_START NAME={params.S}
      {% endif %}
    {% endif %}
  {% endif %}

