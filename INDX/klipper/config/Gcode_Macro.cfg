[gcode_macro ADAPTIVE_MESH]
description: "Mesh pipeline on T0 and the load cell: home if needed, Z tilt if not yet applied (or FORCE_Z_TILT=1), re-home Z, adaptive mesh"
gcode:
  {% set probe_count = params.PROBE_COUNT|default("7,7") %}
  {% set margin = params.MARGIN|default(8)|int %}
  {% set profile = params.PROFILE|default("")|string %}
  {% set force_zt = params.FORCE_Z_TILT|default(0)|int %}
  {% set skip_zt = params.SKIP_Z_TILT|default(0)|int %}
  {% set origin_scv = printer.toolhead.square_corner_velocity|float %}
  {% set probe_scv = params.PROBE_SCV|default(1.0)|float %}
  {% set explicit = params.MESH_MIN_X is defined and params.MESH_MIN_Y is defined and params.MESH_MAX_X is defined and params.MESH_MAX_Y is defined %}
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  _LEVEL_ON_T0
  {% set need_zt = force_zt == 1 or (skip_zt != 1 and printer.z_tilt is defined and not printer.z_tilt.applied|default(False)) %}
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={probe_scv}
  {% if need_zt %}
    Z_TILT_ADJUST
    G28 Z
  {% endif %}
  BED_MESH_CLEAR
  {% if explicit %}
    BED_MESH_CALIBRATE PROBE_COUNT={probe_count} MESH_MIN={params.MESH_MIN_X},{params.MESH_MIN_Y} MESH_MAX={params.MESH_MAX_X},{params.MESH_MAX_Y}
  {% else %}
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={margin} PROBE_COUNT={probe_count}
  {% endif %}
  {% if profile|length > 0 %}
    BED_MESH_PROFILE SAVE={profile}
    RESPOND TYPE=command MSG="Saved mesh profile {profile}"
  {% endif %}
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={origin_scv}

[gcode_macro HOME_XY_REPEAT]
description: "Repeat X/Y sensorless homing cycles for improved repeatability. Params: PASSES=3 DWELL_MS=200"
gcode:
  {% set passes = params.PASSES|default(3)|int %}
  {% set dwell_ms = params.DWELL_MS|default(200)|int %}
  {% if passes < 1 %}
    {% set passes = 1 %}
  {% endif %}
  {% if dwell_ms < 0 %}
    {% set dwell_ms = 0 %}
  {% endif %}

  RESPOND TYPE=command MSG="HOME_XY_REPEAT: running {passes} XY homing pass(es)."
  {% for i in range(passes) %}
    G28 X Y
    M400
    {% if (i + 1) < passes and dwell_ms > 0 %}
      G4 P{dwell_ms}
    {% endif %}
  {% endfor %}
  RESPOND TYPE=command MSG="HOME_XY_REPEAT complete."


[gcode_macro HEAT_SOAK_CALIBRATE]
description: "Bed-first heat soak with optional chamber stage and Z248 pre-position (INDX: no toolboard fans, no Beacon settle)"
gcode:
  {% set bed = params.BED|default(60)|float %}
  {% set chamber = params.CHAMBER|default(50)|float %}
  {% set soak = params.SOAK_MIN|default(5)|float %}
  {% set soak_explicit = params.SOAK_EXPLICIT|default(0)|int %}
  {% set adaptive = params.ADAPTIVE|default(printer["gcode_macro _AHS_STATE"].enable)|int %}
  {% set quality = params.QUALITY|default(printer["gcode_macro _AHS_STATE"].quality)|int %}
  {% set first_layer_minutes = params.FIRST_LAYER_MINUTES|default(printer["gcode_macro _AHS_STATE"].first_layer_minutes)|float %}
  CONTROLLER_FAN_ON
  HPFAN_ON
  {% if chamber > 0 %}
    CHAMBER_COOL_OFF
  {% else %}
    CHAMBER_COOL_AUTO
  {% endif %}
  {% if "z" in printer.toolhead.homed_axes %}
    G90
    G1 Z248 F1800
  {% else %}
    RESPOND TYPE=command MSG="HEAT_SOAK_CALIBRATE: Z not homed, skipping Z248 pre-position."
  {% endif %}
  {% if soak_explicit == 1 or adaptive == 0 %}
    AHS_PLAN BED={bed} CHAMBER={chamber} ADAPTIVE=0 FIXED_MINUTES={soak}
  {% else %}
    AHS_PLAN BED={bed} CHAMBER={chamber} ADAPTIVE=1 QUALITY={quality} FIRST_LAYER_MINUTES={first_layer_minutes}
  {% endif %}
  RESPOND TYPE=command MSG="HEAT_SOAK stage 1: bed to {'%.1f'|format(bed)}C"
  M140 S{bed}
  {% if chamber > 0 %}
    RESPOND TYPE=command MSG="HEAT_SOAK stage 1b: chamber preheat to {'%.1f'|format(chamber)}C (during bed heat)"
    CHAMBER_HEAT S={chamber}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_controller_fan_auto DURATION=0.1
  UPDATE_DELAYED_GCODE ID=HPFAN_LOOP DURATION=0.1
  M190 S{bed}
  {% if chamber > 0 %}
    {% set cap = printer["gcode_macro _CHAMBER_LIMITS"].max_target|float %}
    {% set ct = cap if chamber > cap else chamber %}
    RESPOND TYPE=command MSG="HEAT_SOAK stage 2: chamber settle at {'%.1f'|format(ct)}C"
    TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater1" MINIMUM={ct - 0.5}
    TEMPERATURE_WAIT SENSOR="heater_generic chamber_heater2" MINIMUM={ct - 0.5}
  {% endif %}
  AHS_HOLD
  CONTROLLER_FAN_AUTO
  HPFAN_AUTO_ENABLE
  CHAMBER_COOL_AUTO
  UPDATE_DELAYED_GCODE ID=_controller_fan_auto DURATION=0.1
  UPDATE_DELAYED_GCODE ID=HPFAN_LOOP DURATION=0.1
  UPDATE_DELAYED_GCODE ID=_chamber_cool_auto DURATION=0.1

[gcode_macro FILAMENT_LOAD]
description: "Load a tool over its purge bucket: pick it up, then Bondtech's LOAD_FILAMENT (heat model, heat, feed, prime), then wipe. Params: TOOL=0..4 TYPE=PLA|PETG|ABS|ASA|PA|PC|TPU [TEMP=] [FILAMENT=name] [MEASURE=1] [WIPE=1]"
gcode:
  {% set tool = params.TOOL|default(0)|int %}
  {% set filament = params.FILAMENT|default("")|string|replace('"', '') %}
  {% set wipe = params.WIPE|default(1)|int %}
  {% set extra = (" TYPE=" ~ params.TYPE if params.TYPE is defined else "") ~ (" TEMP=" ~ params.TEMP if params.TEMP is defined else "") ~ (" MEASURE=" ~ params.MEASURE if params.MEASURE is defined else "") %}
  {% if tool < 0 or tool > 4 %}
    { action_raise_error("FILAMENT_LOAD: TOOL must be 0..4 (got %d)" % tool) }
  {% endif %}
  CHANGE_TOOL TOOL={tool}
  _STATION_GO TOOL={tool}
  LOAD_FILAMENT TOOL={tool}{extra}
  {% if wipe == 1 %}
    _STATION_WIPE TOOL={tool}
  {% else %}
    G1 Y{printer["gcode_macro _STATION_VARS"].clearance_y} F12000
  {% endif %}
  {% if filament|length > 0 %}
    SET_TOOL_MATERIAL TOOL={tool} FILAMENT={filament}
  {% else %}
    TOOLING_STATUS_REFRESH
  {% endif %}

[gcode_macro FILAMENT_UNLOAD]
description: "Unload a tool over its purge bucket: pick it up, heat, tip-form push, retract. Params: TOOL=0..4 TEMP=220 LEN=160 SPEED=8 CHUNK=45"
gcode:
  {% set tool = params.TOOL|default(0)|int %}
  {% set temp = params.TEMP|default(220)|float %}
  {% set length = params.LEN|default(160)|float %}
  {% set speed = params.SPEED|default(8)|float %}
  {% set chunk = params.CHUNK|default(45)|float %}
  {% if chunk <= 0 %}
    {% set chunk = 45.0 %}
  {% endif %}
  {% if tool < 0 or tool > 4 %}
    { action_raise_error("FILAMENT_UNLOAD: TOOL must be 0..4 (got %d)" % tool) }
  {% endif %}
  CHANGE_TOOL TOOL={tool}
  _STATION_GO TOOL={tool}
  M104 S{temp}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp - 2}
  M83
  G92 E0
  G1 E8 F240
  {% set total = length|abs %}
  {% set full = (total // chunk)|int %}
  {% set rem = (total - (full * chunk))|float %}
  {% for _ in range(full) %}
    G1 E-{chunk} F{speed * 60}
  {% endfor %}
  {% if rem > 0.0001 %}
    G1 E-{rem} F{speed * 60}
  {% endif %}
  G92 E0
  M104 S0
  _STATION_WIPE TOOL={tool}
  SET_TOOL_MATERIAL TOOL={tool} FILAMENT=EMPTY



[gcode_macro UNLOAD_FILAMENT]
description: Compatibility alias for FILAMENT_UNLOAD
gcode:
  FILAMENT_UNLOAD TOOL={params.TOOL|default(0)} TEMP={params.TEMP|default(220)} LEN={params.LEN|default(160)} SPEED={params.SPEED|default(8)}





