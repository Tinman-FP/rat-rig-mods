[gcode_macro START_PRINT]
description: "Robust start wrapper (backward-compatible slicer entrypoint)"
gcode:
  {% set tool = params.TOOL|default(params.INITIAL_TOOL|default(0))|int %}
  {% set tools = params.TOOLS|default("auto")|string %}
  {% set bed = params.BED|default(params.BED_TEMP|default(60))|float %}
  {% set hotend = params.HOTEND|default(params.EXTRUDER|default(params.EXTRUDER_TEMP|default(200)))|float %}
  {% set chamber = params.CHAMBER|default(params.CHAMBER_TEMP|default(50))|float %}
  {% set soak = params.SOAK_MIN|default(5)|float %}
  {% set soak_explicit = 1 if params.SOAK_MIN is defined else 0 %}
  {% set adaptive_soak = params.ADAPTIVE_SOAK|default(printer["gcode_macro _AHS_STATE"].enable)|int %}
  {% set ahs_quality = params.AHS_QUALITY|default(printer["gcode_macro _AHS_STATE"].quality)|int %}
  {% set first_layer_minutes = params.FIRST_LAYER_MINUTES|default(printer["gcode_macro _AHS_STATE"].first_layer_minutes)|float %}
  {% set preheat = params.PREHEAT|default(150)|float %}
  {% set probe_count = params.PROBE_COUNT|default("7,7") %}
  {% set margin = params.MARGIN|default(8)|int %}
  {% set contact = params.CONTACT|default(0)|int %}
  {% set contact_samples = params.CONTACT_SAMPLES|default(3)|int %}
  {% set force_zt = params.FORCE_Z_TILT|default(0)|int %}
  {% set pre_probe_wipe = params.PRE_PROBE_WIPE|default(1)|int %}
  {% set pre_probe_wipe_count = params.PRE_PROBE_WIPE_COUNT|default(8)|int %}

  START_PRINT_ADV TOOL={tool} TOOLS={tools} BED={bed} HOTEND={hotend} CHAMBER={chamber} SOAK_MIN={soak} SOAK_EXPLICIT={soak_explicit} ADAPTIVE_SOAK={adaptive_soak} AHS_QUALITY={ahs_quality} FIRST_LAYER_MINUTES={first_layer_minutes} PREHEAT={preheat} PROBE_COUNT={probe_count} MARGIN={margin} CONTACT={contact} CONTACT_SAMPLES={contact_samples} FORCE_Z_TILT={force_zt} PRE_PROBE_WIPE={pre_probe_wipe} PRE_PROBE_WIPE_COUNT={pre_probe_wipe_count} PRIME={params.PRIME|default(8)}

[gcode_macro PRINT_START]
description: "Compatibility wrapper: route PRINT_START to START_PRINT_ADV pipeline"
gcode:
  START_PRINT {rawparams}

[gcode_macro END_PRINT]
description: "Compatibility wrapper: route END_PRINT to PRINT_END shutdown sequence"
gcode:
  PRINT_END

[gcode_macro START_PRINT_VALIDATE]
description: Validate and echo print-start parameters (optional STRICT=1 to hard-fail)
gcode:
  {% set strict = params.STRICT|default(0)|int %}
  {% set tool = params.TOOL|default(params.INITIAL_TOOL|default(0))|int %}
  {% set bed = params.BED|default(params.BED_TEMP|default(60))|float %}
  {% set hotend = params.HOTEND|default(params.EXTRUDER|default(params.EXTRUDER_TEMP|default(200)))|float %}
  {% set chamber = params.CHAMBER|default(params.CHAMBER_TEMP|default(0))|float %}
  {% set soak = params.SOAK_MIN|default(5)|float %}

  {% set ok = 1 %}
  {% if tool < 0 or tool > 4 %}
    {% set ok = 0 %}
    RESPOND TYPE=error MSG="START_PRINT_VALIDATE: TOOL must be 0..4 (got {tool})"
  {% endif %}
  {% if bed < 0 or bed > 130 %}
    {% set ok = 0 %}
    RESPOND TYPE=error MSG="START_PRINT_VALIDATE: BED out of expected range 0..130C (got {'%.1f'|format(bed)})"
  {% endif %}
  {% if hotend < 150 or hotend > 320 %}
    {% set ok = 0 %}
    RESPOND TYPE=error MSG="START_PRINT_VALIDATE: HOTEND out of expected range 150..320C (got {'%.1f'|format(hotend)})"
  {% endif %}
  {% if chamber < 0 or chamber > 90 %}
    {% set ok = 0 %}
    RESPOND TYPE=error MSG="START_PRINT_VALIDATE: CHAMBER out of expected range 0..90C (got {'%.1f'|format(chamber)})"
  {% endif %}
  {% if soak < 0 or soak > 120 %}
    {% set ok = 0 %}
    RESPOND TYPE=error MSG="START_PRINT_VALIDATE: SOAK_MIN out of expected range 0..120 (got {'%.1f'|format(soak)})"
  {% endif %}

  RESPOND TYPE=command MSG="START_PRINT_VALIDATE: TOOL={tool} BED={'%.1f'|format(bed)} HOTEND={'%.1f'|format(hotend)} CHAMBER={'%.1f'|format(chamber)} SOAK_MIN={'%.1f'|format(soak)}"
  {% if ok == 0 and strict == 1 %}
    { action_raise_error("START_PRINT_VALIDATE failed. Correct parameters and retry.") }
  {% endif %}

[gcode_macro _FIRST_LAYER_TUNE_STATE]
description: Internal state for first-layer tune mode
variable_enabled: 0
variable_speed_percent: 80
variable_layers: 3
variable_extra_wipe: 0
variable_wipe_count: 2
gcode:

[gcode_macro FIRST_LAYER_TUNE_MODE]
description: First-layer diagnostics mode. Usage: FIRST_LAYER_TUNE_MODE MODE=ON/OFF [SPEED=80 LAYERS=3 EXTRA_WIPE=0 WIPE_COUNT=2]
gcode:
  {% set mode = params.MODE|default("status")|string|lower %}
  {% set st = printer["gcode_macro _FIRST_LAYER_TUNE_STATE"] %}
  {% if mode in ["on", "enable", "1"] %}
    {% set speed = params.SPEED|default(st.speed_percent)|int %}
    {% set layers = params.LAYERS|default(st.layers)|int %}
    {% set extra = params.EXTRA_WIPE|default(st.extra_wipe)|int %}
    {% set wc = params.WIPE_COUNT|default(st.wipe_count)|int %}
    {% if speed < 10 or speed > 200 %}
      { action_raise_error("FIRST_LAYER_TUNE_MODE: SPEED must be 10..200 percent.") }
    {% endif %}
    {% if layers < 1 or layers > 20 %}
      { action_raise_error("FIRST_LAYER_TUNE_MODE: LAYERS must be 1..20.") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_FIRST_LAYER_TUNE_STATE VARIABLE=enabled VALUE=1
    SET_GCODE_VARIABLE MACRO=_FIRST_LAYER_TUNE_STATE VARIABLE=speed_percent VALUE={speed}
    SET_GCODE_VARIABLE MACRO=_FIRST_LAYER_TUNE_STATE VARIABLE=layers VALUE={layers}
    SET_GCODE_VARIABLE MACRO=_FIRST_LAYER_TUNE_STATE VARIABLE=extra_wipe VALUE={1 if extra > 0 else 0}
    SET_GCODE_VARIABLE MACRO=_FIRST_LAYER_TUNE_STATE VARIABLE=wipe_count VALUE={wc}
    RESPOND TYPE=command MSG="First-layer tune ENABLED: speed={speed}% layers={layers} extra_wipe={1 if extra > 0 else 0} wipe_count={wc}"
  {% elif mode in ["off", "disable", "0"] %}
    SET_GCODE_VARIABLE MACRO=_FIRST_LAYER_TUNE_STATE VARIABLE=enabled VALUE=0
    M220 S100
    RESPOND TYPE=command MSG="First-layer tune DISABLED and speed reset to 100%."
  {% else %}
    RESPOND TYPE=command MSG="First-layer tune status: enabled={st.enabled|int} speed={st.speed_percent|int}% layers={st.layers|int} extra_wipe={st.extra_wipe|int} wipe_count={st.wipe_count|int}"
  {% endif %}

[gcode_macro LAYER_CHANGE]
description: "Public layer-change hook with optional periodic nozzle wipe"
gcode:
  _LAYER_CHANGE_CORE {% for p in params %}{'%s=%s ' % (p, params[p])}{% endfor %}


[gcode_macro _ON_LAYER_CHANGE]
description: "Private slicer compatibility layer-change hook"
gcode:
  _LAYER_CHANGE_CORE {% for p in params %}{'%s=%s ' % (p, params[p])}{% endfor %}


[gcode_macro _LAYER_CHANGE_CORE]
description: "Shared layer-change implementation; ignores duplicate/backward slicer hooks"
gcode:
  {% set st = printer["gcode_macro _LAYER_WIPE_STATE"] %}
  {% set flt = printer["gcode_macro _FIRST_LAYER_TUNE_STATE"] %}
  {% set plr = printer["gcode_macro _PLR_STATE"] %}
  {% set next_layer = (st.count|int + 1) %}
  {% set layer = params.LAYER|default(params.LAYER_NUM|default(next_layer))|int %}
  {% set prior = st.count|int %}
  {% if layer > prior %}
    SET_GCODE_VARIABLE MACRO=_LAYER_WIPE_STATE VARIABLE=count VALUE={layer}
    {% if flt.enabled|int == 1 %}
      {% if layer <= flt.layers|int %}
        RESPOND TYPE=command MSG="FIRST_LAYER_TUNE: layer={layer}/{flt.layers|int} speed={flt.speed_percent|int}%"
      {% elif layer == (flt.layers|int + 1) %}
        M220 S100
        SET_GCODE_VARIABLE MACRO=_FIRST_LAYER_TUNE_STATE VARIABLE=enabled VALUE=0
        RESPOND TYPE=command MSG="FIRST_LAYER_TUNE: complete at layer {flt.layers|int}, speed restored to 100%."
      {% endif %}
    {% endif %}
    {% if plr.enabled|int == 1 and plr.interval|int > 0 and layer > 0 and (layer % (plr.interval|int)) == 0 %}
      PLR_SNAPSHOT LAYER={layer}
    {% endif %}
    {% if st.enabled|int == 1 and st.interval|int > 0 and layer > 0 and (layer % (st.interval|int)) == 0 %}
      {% set tool = params.TOOL|default(printer.save_variables.variables.active_tool|default(0))|int %}
      {% set wipe_count = st.wipe_count|int %}
      RESPOND TYPE=command MSG="LAYER_CHANGE: periodic wipe at layer {layer} (interval={st.interval|int}, tool={tool}, count={wipe_count})"
      CLEAN_NOZZLE TOOL={tool} COUNT={wipe_count}
    {% endif %}
  {% endif %}


[gcode_macro _LAYER_WIPE_STATE]
description: Internal state for periodic layer-change nozzle wipe
variable_enabled: 1
variable_interval: 5
variable_count: -1
variable_wipe_count: 3
gcode:





















[gcode_macro LAYER_WIPE_ENABLE]
description: Enable periodic layer-change wipe (optional INTERVAL and COUNT)
gcode:
  {% set interval = params.INTERVAL|default(printer["gcode_macro _LAYER_WIPE_STATE"].interval)|int %}
  {% set count = params.COUNT|default(printer["gcode_macro _LAYER_WIPE_STATE"].wipe_count)|int %}
  {% if interval < 1 %}
    { action_raise_error("INTERVAL must be >= 1") }
  {% endif %}
  {% if count < 1 %}
    { action_raise_error("COUNT must be >= 1") }
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_LAYER_WIPE_STATE VARIABLE=enabled VALUE=1
  SET_GCODE_VARIABLE MACRO=_LAYER_WIPE_STATE VARIABLE=interval VALUE={interval}
  SET_GCODE_VARIABLE MACRO=_LAYER_WIPE_STATE VARIABLE=wipe_count VALUE={count}
  RESPOND TYPE=command MSG="Layer wipe enabled: interval={interval}, wipe_count={count}"

[gcode_macro LAYER_WIPE_DISABLE]
description: Disable periodic layer-change wipe
gcode:
  SET_GCODE_VARIABLE MACRO=_LAYER_WIPE_STATE VARIABLE=enabled VALUE=0
  RESPOND TYPE=command MSG="Layer wipe disabled"

[gcode_macro LAYER_WIPE_STATUS]
description: Show periodic layer-change wipe settings
gcode:
  {% set st = printer["gcode_macro _LAYER_WIPE_STATE"] %}
  RESPOND TYPE=command MSG="Layer wipe: enabled={st.enabled|int} interval={st.interval|int} wipe_count={st.wipe_count|int} layer_count={st.count|int}"


[gcode_macro TIMELAPSE_TAKE_FRAME]
description: "No-op timelapse hook if timelapse plugin/macros are not installed"
gcode:

