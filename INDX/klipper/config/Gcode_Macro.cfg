[gcode_macro CANCEL_ACTIONS]
description: "User cancel actions (safe): LEDs red, heaters off, park if homed"
gcode:
  RGB_ERROR
  TURN_OFF_HEATERS
  PLR_CANCEL_PRINT
  M107
  {% set h = printer.toolhead.homed_axes|string %}
  {% if "x" in h and "y" in h and "z" in h %}
    G91
    G1 Z2 F1200
    G90
    PARK
  {% endif %}
  RESPOND TYPE=command MSG="CANCEL_ACTIONS executed."


