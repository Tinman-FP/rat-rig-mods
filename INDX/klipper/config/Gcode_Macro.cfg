# - NO CANCEL_PRINT definition (prevents duplicate registration)
# - Provides CANCEL_ACTIONS hook macro you can call from your existing
#   CANCEL_PRINT (e.g. in mainsail.cfg/fluidd.cfg)
# - Minimal RGB + parks (stable)
