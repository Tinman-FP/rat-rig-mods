#####################################################################
# V-Core 4.1 INDX: the Bondtech INDX Smart Head. DRAFT for review; not installed, not run.
#
# Replaces Toolheads.cfg, EBB42_T0.cfg and EBB42_T1.cfg (two EBB42 toolboards, extruder and
# extruder1, part_fan_t0/t1, toolboard_fan_t0/t1). With INDX there is one [extruder], the Smart
# Head's DX extruder; the five passive tools are not Klipper extruders. Tool positions and the
# T0..T4 macros are in INDX_Tools.cfg.
#
# Values are Bondtech's (github.com/BondtechAB/INDX README, "Klipper / Kalico", commit ae64179).
# Bondtech marks several as fixed: rotation_distance 5.7, rref 24000, chain_count 16, the
# induction-heater pid_* values and control: watermark. Leave those alone.
# The pins are named aliases from the INDX firmware, not raw MCU pins.
#####################################################################

[indx]
mcu: indxmcu
pid_kp: 1.0                 # induction heater control: Bondtech's values, do not change
pid_ti: 0.0
pid_td: 0.0
pid_b: 1.0

[extruder]
sensor_type: indx           # the head's IR sensor reads the nozzle of whichever tool is on the head
min_temp: 0
max_temp: 300               # Bondtech's sheet: 300 C maximum nozzle temperature (their example says 350)
smooth_time: 0.3            # keeps the display and M109 waits from lagging the fast induction heat-up
heater_pin: indx:heater
control: watermark          # induction is on/off; do not change to pid
nozzle_diameter: 0.4        # set in the slicer per tool; this is only Klipper's extrusion limit check
filament_diameter: 1.75
step_pin: indxmcu:motor_step
dir_pin: indxmcu:motor_dir  # if filament feeds backwards: !indxmcu:motor_dir
enable_pin: !indxmcu:motor_enable
microsteps: 32
rotation_distance: 5.7      # pre-calibrated for the DX extruder; the tool-change macros depend on it

[tmc2240 extruder]
cs_pin: indxmcu:motor_cs
spi_software_sclk_pin: indxmcu:motor_sclk
spi_software_mosi_pin: indxmcu:motor_mosi
spi_software_miso_pin: indxmcu:motor_miso
rref: 24000
run_current: 0.6

# Part cooling: Bondtech's dual 40x10 radial blowers on the INDX PCB's fan output.
# A plain [fan] gives native M106/M107, so the old M106/M107 overrides are gone.
[fan]
pin: indxmcu:part_cooling
tachometer_pin: indxmcu:part_cooling_tacho

[neopixel indx]
pin: indxmcu:led
chain_count: 16

# Head temperatures, for the display and the chamber limit (Heated_Chamber.cfg): Bondtech rates the
# Smart Head for 60 C ambient at most. Kalico's indx sensor also offers sensor, check_model and ldc_coil.
[temperature_sensor INDX_board]
sensor_type: indx
indx_sensor: board

[temperature_sensor INDX_bracket]
sensor_type: indx
indx_sensor: bracket

# Accelerometer on the INDX PCB: Resonance.cfg uses it for input shaping
[lis2dw]
i2c_mcu: indxmcu
i2c_bus: sercom3

# Magnetic encoder on the extruder
[angle indx]
sensor_type: as5047d
stepper: extruder
cs_pin: indxmcu:encoder_cs
spi_bus: sercom1

# The head's load cell is the Z probe (nozzle contact). It replaces the two Beacons.
# counts_per_gram and reference_tare_counts come from CALIBRATE_LOAD_CELL and land in the
# SAVE_CONFIG block of printer.cfg; don't set them by hand.
# z_offset is Bondtech's starting value from their machine; tune it on this one.
# Kalico only: pullback_distance and pullback_speed (tap analysis) are not in mainline Klipper.
[load_cell_probe]
sensor_type: ads131m02
cs_pin: indxmcu:loadcell_cs
spi_bus: sercom1
data_ready_pin: indxmcu:loadcell_drdy
channels: 0
sample_rate: 500
z_offset: -0.15
force_safety_limit: 3200
trigger_force: 150
speed: 2
retry_speed: 1.0
lift_speed: 15
pullback_distance: 0.35
pullback_speed: 0.3
samples: 3
samples_result: median
sample_retract_dist: 0.35
samples_tolerance: 0.05
samples_tolerance_retries: 3

# INDX Eddy Current Scanner (separate Bondtech product, needs Kalico 2026-10-08 or later).
# Not bought. If fitted later, it scans meshes fast; Z homing stays on the load cell.
# Bondtech's block, for reference:
#[probe_eddy_current scanner]
#sensor_type: ldc1612
#i2c_mcu: indxmcu
#i2c_bus: sercom3
#intb_pin: indxmcu:ldc_int
#frequency: 25000000
#x_offset: 0
#y_offset: 34.472
#z_offset: 1.0
#register_as_probe: False
#amplitude_errors: high
