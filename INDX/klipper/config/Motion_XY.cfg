#####################################################################
# V-Core 4.1 500: single-carriage CoreXY, 12 mm belts, Bondtech INDX (5 tools)
# DRAFT for review. Not installed; not run on the printer.
#
# Replaces Motion_XY.cfg ([stepper_x], [dual_carriage], [stepper_y], [stepper_y1])
# and the custom hybrid_corexy_ratrig kinematics (klipper-modified/ is retired with it).
# Pins are the owner's existing BTT Octopus assignments.
#
# Coordinates (see cad/.../source/vc12_params.py):
#   X = CAD nozzle X + 255     -> PEI spans X 0..510
#   Y = CAD beam Y + 225.8     -> printable Y 0..484.5 (PEI rear edge). Y 0 is the clearance line: 40 mm
#                                 behind the docked nozzles (radial-cooling ducts need it; Bondtech's 26 does not clear)
#   Docks: tools park at Y -40.0; X -20, 102, 224, 346, 468 (122 mm pitch): INDX_Tools.cfg.
#   Each tool's purge bucket and wiper pad sits just right of its dock: Stations.cfg.
#
# Wiring:
#   A belt (lower, left rear motor, mounted under the corner)  -> MOTOR0, as the old stepper_x
#   B belt (upper, right rear motor, mounted over the corner)  -> MOTOR1, the old stepper_y socket
#   MOTOR3 (old stepper_y1) and the old dual_carriage socket become free.
#
# Homing: homing_indx.cfg. Y to the rear stop, then X, each twice; X only behind Y 388.8.
#####################################################################

[stepper_x]                # motor A: moves +X+Y together
step_pin: PF13
dir_pin: PF12              # set the direction with STEPPER_BUZZ and the CoreXY direction table
enable_pin: !PF14
microsteps: 64
rotation_distance: 40      # 20T x 2 mm
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -35
position_min: -35          # carriage against the left joint
position_max: 545
homing_positive_dir: false  # X homes to the left stop; homing_indx.cfg reads this
homing_speed: 25            # one speed for both passes of homing_indx.cfg; tune with driver_SGTHRS
homing_retract_dist: 0      # sensorless: homing_indx.cfg does the second pass and the move off the stop

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 1.40          # check the motor's rating first; the old value was 1.28
sense_resistor: 0.110      # BTT TMC2209; Kalico requires it (mainline Klipper defaulted to 0.110)
stealthchop_threshold: 0
diag_pin: PG6
driver_SGTHRS: 46          # retune for the new belts and stops

[stepper_y]                # motor B: moves +X-Y
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 64
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 488.8    # Y homes to the REAR stop: the docks are at the front
position_min: -41          # tool pickup at -40.0
position_max: 488.8
homing_positive_dir: true
homing_speed: 25
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 1.40
sense_resistor: 0.110      # BTT TMC2209; Kalico requires it (mainline Klipper defaulted to 0.110)
stealthchop_threshold: 0
diag_pin: PG9
driver_SGTHRS: 46
