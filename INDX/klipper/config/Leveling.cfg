# Leveling.cfg
#
# INDX: Z tilt and the mesh probe with the load cell (the nozzle itself, so no probe offset),
# always with T0 on the head: Bondtech stores every tool's Z offset relative to T0.
# The IDEX wrappers (SAVE_DUAL_CARRIAGE_STATE, SET_DUAL_CARRIAGE) are gone.
#
# New origin: X = old X + 5, Y = old Y - 35.5 (Y 0 is now the clearance line behind the docks,
# 35.5 mm in from the PEI's front edge). The z_positions are the old ones moved to the new
# origin; they only need to be roughly right (z_tilt retries until it is within tolerance).
# Every probe point is at Y >= 0, behind the clearance line.
#####################################################################

[z_tilt]
z_positions:
    5,-35.5
    255,464.5
    505,-35.5
points:
    85,45
    425,45
    255,385
speed: 150
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.01

[gcode_macro _LEVEL_ON_T0]
description: Inner - make sure T0 is on the head before probing (G28 Z does the same)
gcode:
    {% set svv = printer.save_variables.variables %}
    {% if svv.active_tool|default(-1)|int != 0 %}
        CHANGE_TOOL TOOL=0      # not T0: probing doesn't need filament in T0, so skip its runout check
    {% endif %}

[gcode_macro Z_TILT_ADJUST]
rename_existing: _BASE_Z_TILT_ADJUST
description: Z tilt on the load cell, with T0 on the head and no tool offset applied
gcode:
    _LEVEL_ON_T0
    SAVE_GCODE_STATE NAME=_zt_state
    G90
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    _BASE_Z_TILT_ADJUST {rawparams}
    RESTORE_GCODE_STATE NAME=_zt_state

[gcode_macro SAFE_Z_TILT]
description: Lift, go to the bed centre, Z tilt, then home Z again on T0
gcode:
    G90
    G1 Z10 F3000
    G1 X255 Y242 F12000
    Z_TILT_ADJUST
    G28 Z

# One touch per point (about 5 s each). BED_MESH_CALIBRATE ADAPTIVE=1 probes only the print area.
# The mesh is zeroed at the G28 Z point, so it carries the bed's shape, not its height.
[bed_mesh]
speed: 150
horizontal_move_z: 2
mesh_min: 15,15
mesh_max: 495,470
probe_count: 7,7
algorithm: bicubic
zero_reference_position: 255,242

[gcode_macro BED_MESH_NOW]
description: Home + Z tilt + bed mesh calibration
gcode:
    G28
    Z_TILT_ADJUST
    G28 Z
    _LEVEL_ON_T0
    BED_MESH_CALIBRATE
    G1 X255 Y242 Z10 F12000
