#####################################################################
# V-Core 4.1 INDX: one runout switch per tool. DRAFT for review; not installed, not run.
#
# Replaces the IDEX sensors in Heated_Chamber.cfg: the Apus 2 switches on the EBB42 toolboards
# (gone with the toolboards), the two monitor-only mainboard switches (PG10, PG14) and the two
# monitor-only motion sensors (PG15, PG13).
#
# Each tool has its own filament path (dryer -> PTFE -> coupler block -> tool), so each tool gets
# its own switch at the spool side, wired to the Octopus's endstop inputs, which the
# conversion leaves free:
#   T0 PG10   T1 PG11   T2 PG12   T3 PG13   T4 PG14   (PG15 spare; PG12 was the dual carriage's)
# Polarity: written like the old mainboard switches (plain pin). Check each with
# QUERY_FILAMENT_SENSOR SENSOR=Tn_runout, filament in and out, and add ^ / ! if it reads backwards.
# The sensors and their mounts are not in the CAD yet.
#
# Behaviour:
#   - The tool on the head runs out while printing: PAUSE (as before).
#   - A parked tool runs out (someone pulled it, or a spool ended between uses): a warning only.
#     The print pauses if that tool is picked up while its switch still reads empty
#     (_FS_AFTER_PICKUP, called by AFTER_TOOL_CHANGE in INDX_Tools.cfg).
#   - PRECHECK_ENFORCE (Gcode_Macro.cfg) refuses to start a print when a tool it uses is empty.
#####################################################################

[filament_switch_sensor T0_runout]
switch_pin: PG10
pause_on_runout: False
runout_gcode: _FS_RUNOUT TOOL=0
insert_gcode: _FS_INSERT TOOL=0

[filament_switch_sensor T1_runout]
switch_pin: PG11
pause_on_runout: False
runout_gcode: _FS_RUNOUT TOOL=1
insert_gcode: _FS_INSERT TOOL=1

[filament_switch_sensor T2_runout]
switch_pin: PG12
pause_on_runout: False
runout_gcode: _FS_RUNOUT TOOL=2
insert_gcode: _FS_INSERT TOOL=2

[filament_switch_sensor T3_runout]
switch_pin: PG13
pause_on_runout: False
runout_gcode: _FS_RUNOUT TOOL=3
insert_gcode: _FS_INSERT TOOL=3

[filament_switch_sensor T4_runout]
switch_pin: PG14
pause_on_runout: False
runout_gcode: _FS_RUNOUT TOOL=4
insert_gcode: _FS_INSERT TOOL=4

[gcode_macro _FS_RUNOUT]
description: Inner - a tool's runout switch went empty
gcode:
  {% set tool = params.TOOL|int %}
  {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
  {% set printing = printer.print_stats.state|string == "printing" %}
  {% if printing and tool == act %}
    M117 T{tool} Filament Runout
    PAUSE STATE=filament_change
    RESPOND TYPE=error MSG="T{tool} filament runout detected (tool on the head): paused"
  {% elif printing %}
    RESPOND TYPE=error MSG="T{tool} filament switch reads empty while T{tool} is parked. The print pauses if T{tool} is picked up empty."
  {% else %}
    RESPOND MSG="T{tool} filament out"
  {% endif %}

[gcode_macro _FS_INSERT]
description: Inner - a tool's runout switch sees filament
gcode:
  {% set tool = params.TOOL|int %}
  M117 T{tool} Filament Inserted
  RESPOND MSG="T{tool} filament inserted"

[gcode_macro _FS_AFTER_PICKUP]
description: Pause a print if the tool just picked up has no filament. TOOL=n
gcode:
  {% set tool = params.TOOL|int %}
  {% set s = printer["filament_switch_sensor T%d_runout" % tool] %}
  {% if s is defined and s.enabled and not s.filament_detected and printer.print_stats.state|string == "printing" %}
    M117 T{tool} Empty
    PAUSE STATE=filament_change
    RESPOND TYPE=error MSG="T{tool} was picked up but its switch reads no filament: paused. Load it (LOAD_FILAMENT TOOL={tool} TYPE=...) and RESUME."
  {% endif %}

[gcode_macro FILAMENT_STATUS]
description: Report all five runout switches
gcode:
  {% set ns = namespace(msg="") %}
  {% for t in range(5) %}
    {% set s = printer["filament_switch_sensor T%d_runout" % t] %}
    {% set st = ("yes" if s.filament_detected else "EMPTY") if s.enabled else "disabled" %}
    {% set ns.msg = ns.msg ~ "T%d=%s " % (t, st) %}
  {% endfor %}
  RESPOND MSG="Filament: {ns.msg}"
