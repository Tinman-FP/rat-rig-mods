#####################################################################
# Codex PLR shell bridge (INDX conversion). DRAFT, not run.
#
# Kalico has [gcode_shell_command] built in, so this file can be included
# directly (on the IDEX machine it needed an extra and stayed optional).
# Check once that RUN_SHELL_COMMAND works: CODEX_PLR_STATUS_HOST with no print.
# The PLR macros in PLR.cfg do not need this file.
#
# Same four commands as the IDEX version. The host tool now also checks the
# tool on the head (active_tool, latch, seat_suspect) against the snapshot.
#####################################################################

[gcode_shell_command codex_plr_precheck]
command: /usr/bin/python3 /home/pi/printer_data/config/scripts/codex_plr_tool.py precheck
timeout: 45
verbose: True

[gcode_shell_command codex_plr_status]
command: /usr/bin/python3 /home/pi/printer_data/config/scripts/codex_plr_tool.py status
timeout: 15
verbose: True

[gcode_shell_command codex_plr_archive]
command: /usr/bin/python3 /home/pi/printer_data/config/scripts/codex_plr_tool.py archive
timeout: 20
verbose: True

[gcode_shell_command codex_plr_clear]
command: /usr/bin/python3 /home/pi/printer_data/config/scripts/codex_plr_tool.py clear --yes
timeout: 20
verbose: True

[gcode_macro CODEX_PLR_PRECHECK_HOST]
description: Run safe macro precheck, then write host-side report/locked runfile
gcode:
  CODEX_PLR_PRECHECK
  RUN_SHELL_COMMAND CMD=codex_plr_precheck

[gcode_macro CODEX_PLR_STATUS_HOST]
description: Print the current host-side PLR status from the monitor snapshot
gcode:
  RUN_SHELL_COMMAND CMD=codex_plr_status

[gcode_macro CODEX_PLR_ARCHIVE_HOST]
description: Archive host-side PLR state without changing save_variables
gcode:
  RUN_SHELL_COMMAND CMD=codex_plr_archive

[gcode_macro CODEX_PLR_CLEAR_HOST]
description: Archive/clear host-side PLR files and clear Klipper save_variables
gcode:
  RUN_SHELL_COMMAND CMD=codex_plr_clear
  PLR_CLEAR
