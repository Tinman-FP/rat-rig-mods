#####################################################################
# V-Core 4.1 INDX: one purge bucket and one Qidi wiper pad per tool. DRAFT for review; not installed, not run.
#
# Each tool's station sits just right of its own dock, in front of the bed and below the head
# (CAD: vc12_params.py). In printer coordinates (X = CAD X + 255), all at Y -40.0, the dock row:
#   tool            T0    T1    T2    T3    T4
#   dock X         -20   102   224   346   468
#   purge X         27   149   271   393   515   (47 mm right of the dock)
#   pad left        33   155   277   399   521   (15 mm wide in X, 27 deep in Y; the nozzle wipes
#                                                  3 mm in from its rear edge)
#   wipe stroke     purge X + 4 .. purge X + 20   (starts and ends just off the pad's left end)
# Pad top 1.2 mm above the nozzle tip; set it with the station-rail brackets' slotted holes.
# The bed's height does not matter here: the stations are in front of the bed, not over it.
# Reach a station only from clearance_y (0.0), moving in Y at the purge X: the head clears the docks
# on either side by 5.6 and 10.5 mm more than it needs (Bondtech's real ducts), and only along Y.
#
# PURGE_AND_WIPE  TOOL=n LENGTH=mm   purge into the bucket, then wipe (used after a filament load)
# CLEAN_NOZZLE    [TOOL=n] [COUNT=n] wipe only (print start, before probing). Replaces the IDEX
#                                     CLEAN_NOZZLE / CLEAN_NOZZLE_T0 / _T1 and PARK_BEFORE_WIPE_PAD.
# Both refuse to run unless TOOL is the tool on the head, and need X/Y homed.
#####################################################################

[gcode_macro _STATION_VARS]
variable_clearance_y: 0.0
variable_station_y: -40.0
variable_purge_x: [27, 149, 271, 393, 515]
variable_wipe_from: 4.0       # relative to purge_x
variable_wipe_to: 20.0
variable_passes: 3
variable_travel_f: 12000
variable_wipe_f: 6000
gcode:

[gcode_macro _STATION_CHECK]
description: Inner - TOOL must be on the head, X/Y homed. Sets nothing.
gcode:
    {% set tool = params.TOOL|int %}
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    {% if "xy" not in printer.toolhead.homed_axes %}
        { action_raise_error("Stations: home X and Y first") }
    {% endif %}
    {% if tool != act %}
        { action_raise_error("Stations: T%d is not on the head (active_tool=%d)" % (tool, act)) }
    {% endif %}
    {% if tool < 0 or tool >= printer["gcode_macro _STATION_VARS"].purge_x|length %}
        { action_raise_error("Stations: no station for T%d" % tool) }
    {% endif %}

[gcode_macro _STATION_WIPE]
description: Inner - at the station, wipe COUNT passes, then back to the clearance line
gcode:
    {% set v = printer["gcode_macro _STATION_VARS"] %}
    {% set px = v.purge_x[params.TOOL|int] %}
    {% set n = params.COUNT|default(v.passes)|int %}
    G1 X{px + v.wipe_from} F{v.travel_f}
    {% for i in range(n) %}
        G1 X{px + v.wipe_to} F{v.wipe_f}
        G1 X{px + v.wipe_from} F{v.wipe_f}
    {% endfor %}
    G1 Y{v.clearance_y} F{v.travel_f}

[gcode_macro _STATION_GO]
description: Inner - from the clearance line, straight in along Y to TOOL's purge spot
gcode:
    {% set v = printer["gcode_macro _STATION_VARS"] %}
    {% set px = v.purge_x[params.TOOL|int] %}
    G90
    G1 Y{v.clearance_y} F{v.travel_f}
    G1 X{px} F{v.travel_f}
    G1 Y{v.station_y} F{v.travel_f}

[gcode_macro PURGE_AND_WIPE]
description: Purge the active tool into its own bucket, then wipe it on its own pad. TOOL=n LENGTH=mm
gcode:
    {% set tool = params.TOOL|default(printer.save_variables.variables.active_tool|default(-1))|int %}
    {% set length = params.LENGTH|default(15)|float %}
    _STATION_CHECK TOOL={tool}
    {% if printer.extruder.temperature < printer.extruder.target - 5 or printer.extruder.target < 170 %}
        { action_raise_error("PURGE_AND_WIPE: heat T%d first" % tool) }
    {% endif %}
    SAVE_GCODE_STATE NAME=purge_wipe
    _STATION_GO TOOL={tool}
    M83
    G1 E{length} F{4 * 60}               # about 4 mm/s of filament
    G1 E-0.8 F2400
    G4 P1500                             # let the strand drop into the bucket
    _STATION_WIPE TOOL={tool}
    RESTORE_GCODE_STATE NAME=purge_wipe

[gcode_macro CLEAN_NOZZLE]
description: Wipe the active tool on its own pad, no purge. [TOOL=n] [COUNT=passes]
gcode:
    {% set v = printer["gcode_macro _STATION_VARS"] %}
    {% set tool = params.TOOL|default(printer.save_variables.variables.active_tool|default(-1))|int %}
    {% set n = params.COUNT|default(v.passes)|int %}
    _STATION_CHECK TOOL={tool}
    SAVE_GCODE_STATE NAME=clean_nozzle
    _STATION_GO TOOL={tool}
    _STATION_WIPE TOOL={tool} COUNT={n}
    RESTORE_GCODE_STATE NAME=clean_nozzle
