#####################################################################
# PARKING
#####################################################################

[gcode_macro PARK]
description: Park the head at the rear centre, behind the print and away from the docks (the tool stays on the head)
gcode:
  _ENSURE_XY_HOMED
  {% set v = printer["gcode_macro _PARK_VARS"] %}
  SAVE_GCODE_STATE NAME=_PARK_STATE
  G90
  _CLAMP_Y_IN_BOUNDS
  G1 Y{v.park_y} F12000
  G1 X{v.park_x} F12000
  RESTORE_GCODE_STATE NAME=_PARK_STATE


#####################################################################
# SAFE PAUSE / RESUME
#####################################################################

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
description: Pause print and park safely
gcode:
  {% set state = params.STATE|default("normal")|string %}
  SAVE_GCODE_STATE NAME=_PAUSE_STATE
  PAUSE_BASE
  {% if "xyz" in printer.toolhead.homed_axes %}
    G91
    G1 Z+2.0 F1200
    G90
    PARK
  {% endif %}
  {% if state == "filament_change" %}
    RGB_FILAMENT
  {% else %}
    RGB_PAUSED
  {% endif %}

[gcode_macro RESUME]
rename_existing: RESUME_BASE
description: Resume print (restores state)
gcode:
  RESTORE_GCODE_STATE NAME=_PAUSE_STATE
  RESUME_BASE
  RGB_PRINTING


#####################################################################
# START / END (minimal hooks)
#####################################################################

[gcode_macro PRINT_START_MINIMAL]
description: Minimal print start hook (manual fallback only)
gcode:
  T0

[gcode_macro PRINT_END]
description: Print end hook with full thermal shutdown + chamber cooldown (the tool stays on the head and cools there)
gcode:
  AHS_CAPTURE_HISTORY
  PLR_END_PRINT
  RGB_DONE
  TURN_OFF_HEATERS
  CHAMBER_OFF
  CHAMBER_COOL_AUTO
  CONTROLLER_FAN_AUTO
  M107
  {% if "xy" in printer.toolhead.homed_axes %}
    PARK
  {% endif %}
  TOOLING_STATUS_REFRESH
  RESPOND TYPE=command MSG="PRINT_END: heaters off, chamber cooldown auto enabled."


