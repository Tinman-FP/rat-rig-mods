#####################################################################
# USER CONFIG (edit these)
#####################################################################

[gcode_macro _PARK_VARS]
description: Park position for PAUSE, PRINT_END and cancel (one INDX carriage; was _IDEX_VARS)
variable_park_x: 255.0     # bed centre
variable_park_y: 460.0     # near the rear: behind the print, far from the docks at the front
variable_safe_y_min: 0.0   # clearance_y: never park in front of it, the docks are there
variable_safe_y_max: 484.5
gcode:


[delayed_gcode _TOOLING_STATUS_BOOTSTRAP]
initial_duration: 2.5
gcode:
  TOOLING_STATUS_REFRESH

[gcode_macro TOOLING_STATUS_REFRESH]
description: Refresh Orca/Moonraker display with each tool's filament and nozzle (> marks the tool on the head)
gcode:
  {% set svv = printer.save_variables.variables if printer.save_variables is defined else {} %}
  {% set active = svv.active_tool|default(-1)|int %}
  {% set type_map = {
    "brass": "Br",
    "hardened_steel": "HS",
    "stainless_steel": "SS",
    "ruby": "Ruby",
    "diamond": "Dia",
    "tungsten_carbide": "TC",
    "cm2": "CM2",
    "m2": "M2",
    "undefine": "?",
    "unknown": "?",
    "empty": "-"
  } %}
  {% set ns = namespace(msg="") %}
  {% for t in range(5) %}
    {% set fil = svv["t%d_filament" % t]|default("EMPTY")|string|replace('"', '') %}
    {% set size = ('%.2f'|format(svv["t%d_nozzle_size" % t]|default(0.4)|float)).rstrip('0').rstrip('.') %}
    {% set key = svv["t%d_nozzle_type" % t]|default("unknown")|string|lower|replace('"', '')|replace(' ', '_') %}
    {% set label = (">T%d" if t == active else "T%d") % t %}
    {% set ns.msg = ns.msg ~ (" | " if t > 0 else "") ~ label ~ " " ~ fil ~ " " ~ size ~ " " ~ type_map.get(key, key|upper) %}
  {% endfor %}
  SET_DISPLAY_TEXT MSG="{ns.msg}"

[gcode_macro REPORT_TOOL_SETUP]
description: Report the tracked filament and nozzle setup for all five tools
gcode:
  {% set svv = printer.save_variables.variables if printer.save_variables is defined else {} %}
  {% for t in range(5) %}
    {% set fil = svv["t%d_filament" % t]|default("EMPTY")|string|replace('"', '') %}
    {% set size = ('%.2f'|format(svv["t%d_nozzle_size" % t]|default(0.4)|float)).rstrip('0').rstrip('.') %}
    {% set typ = svv["t%d_nozzle_type" % t]|default("unknown")|string|replace('"', '') %}
    RESPOND TYPE=command MSG="T{t} filament={fil} nozzle={size} type={typ}"
  {% endfor %}
  TOOLING_STATUS_REFRESH

[gcode_macro SET_TOOL_MATERIAL]
description: Record the filament name in a tool (display only). Usage: SET_TOOL_MATERIAL TOOL=0 FILAMENT=ABS-CF. Was SET_TOOL_FILAMENT; that name is now Bondtech's (heat model: DENSITY, HEAT_CAPACITY).
gcode:
  {% set tool = params.TOOL|default(0)|int %}
  {% set filament = params.FILAMENT|default("EMPTY")|string|replace('"', '') %}
  {% if tool < 0 or tool > 4 %}
    { action_raise_error("SET_TOOL_MATERIAL: TOOL must be 0..4 (got %d)" % tool) }
  {% endif %}
  SAVE_VARIABLE VARIABLE=t{tool}_filament VALUE='"{filament}"'
  RESPOND TYPE=command MSG="T{tool} filament set to {filament}"
  TOOLING_STATUS_REFRESH

[gcode_macro SET_TOOL_NOZZLE]
description: Persist nozzle metadata. Usage: SET_TOOL_NOZZLE TOOL=0 SIZE=0.6 TYPE=hardened_steel
gcode:
  {% set svv = printer.save_variables.variables if printer.save_variables is defined else {} %}
  {% set tool = params.TOOL|default(0)|int %}
  {% if tool < 0 or tool > 4 %}
    { action_raise_error("SET_TOOL_NOZZLE: TOOL must be 0..4 (got %d)" % tool) }
  {% endif %}
  {% set size = params.SIZE|default(svv["t%d_nozzle_size" % tool]|default(0.4))|float %}
  {% set nozzle_type = params.TYPE|default(svv["t%d_nozzle_type" % tool]|default("unknown"))|string|lower|replace('"', '')|replace(' ', '_') %}
  SAVE_VARIABLE VARIABLE=t{tool}_nozzle_size VALUE={size}
  SAVE_VARIABLE VARIABLE=t{tool}_nozzle_type VALUE='"{nozzle_type}"'
  RESPOND TYPE=command MSG="T{tool} nozzle set to {('%.2f'|format(size)).rstrip('0').rstrip('.')} / {nozzle_type}"
  TOOLING_STATUS_REFRESH

[gcode_macro SET_TOOL_SETUP]
description: Persist both filament and nozzle metadata for a tool
gcode:
  {% set tool = params.TOOL|default(0)|int %}
  {% if params.FILAMENT is defined %}
    SET_TOOL_MATERIAL TOOL={tool} FILAMENT={params.FILAMENT}
  {% endif %}
  {% if params.SIZE is defined or params.TYPE is defined %}
    SET_TOOL_NOZZLE TOOL={tool} {% if params.SIZE is defined %}SIZE={params.SIZE}{% endif %} {% if params.TYPE is defined %}TYPE={params.TYPE}{% endif %}
  {% endif %}
  TOOLING_STATUS_REFRESH

[gcode_macro SYNC_ORCA_TOOLING]
description: Sync tool filament/nozzle info from Orca start gcode placeholders (T0_..T4_ FILAMENT, NOZZLE, TYPE; NOZZLE_TYPE for all)
gcode:
  {% set skip = ["", "undefine", "undefined", "unknown", "n/a"] %}
  {% for t in range(5) %}
    {% set k = "T%d_" % t %}
    {% if (k ~ "FILAMENT") in params %}
      SAVE_VARIABLE VARIABLE=t{t}_filament VALUE='"{params[k ~ "FILAMENT"]|string|replace('"', '')}"'
    {% endif %}
    {% if (k ~ "NOZZLE") in params %}
      SAVE_VARIABLE VARIABLE=t{t}_nozzle_size VALUE={params[k ~ "NOZZLE"]|float}
    {% endif %}
    {% if (k ~ "TYPE") in params %}
      {% set ty = params[k ~ "TYPE"]|string|lower|replace('"', '')|replace(' ', '_') %}
      {% if ty not in skip %}
        SAVE_VARIABLE VARIABLE=t{t}_nozzle_type VALUE='"{ty}"'
      {% endif %}
    {% endif %}
  {% endfor %}
  {% if params.NOZZLE_TYPE is defined %}
    {% set nozzle_type = params.NOZZLE_TYPE|string|lower|replace('"', '')|replace(' ', '_') %}
    {% if nozzle_type not in skip %}
      {% for t in range(5) %}
        SAVE_VARIABLE VARIABLE=t{t}_nozzle_type VALUE='"{nozzle_type}"'
      {% endfor %}
    {% endif %}
  {% endif %}
  TOOLING_STATUS_REFRESH


#####################################################################
# CORE HELPERS
#####################################################################

[gcode_macro _ENSURE_XY_HOMED]
gcode:
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}

[gcode_macro _CLAMP_Y_IN_BOUNDS]
gcode:
  {% set ymin = printer["gcode_macro _PARK_VARS"].safe_y_min|float %}
  {% set ymax = printer["gcode_macro _PARK_VARS"].safe_y_max|float %}
  {% set y = printer.toolhead.position.y|float %}
  {% if y < ymin %}
    G90
    G1 Y{ymin} F12000
  {% elif y > ymax %}
    G90
    G1 Y{ymax} F12000
  {% endif %}



