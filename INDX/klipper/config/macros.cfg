#
# INDX conversion: one carriage, five passive tools. T0..T4 are in INDX_Tools.cfg (Bondtech's CHANGE_TOOL);
# tool offsets are Bondtech's (CAL_* in INDX/macros/indx-cal.cfg). Removed: the IDEX offset macros,
# IDEX_SINGLE/COPY/MIRROR, the two-carriage PARK. SET_TOOL_FILAMENT is renamed SET_TOOL_MATERIAL.
#####################################################################

# macros.cfg — V-Core 4.1 500 INDX (was CLEAN MAINLINE IDEX MACROS)
# Goal: stable, minimal, no RatOS abstractions.
