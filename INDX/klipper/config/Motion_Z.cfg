# Motion_Z.cfg
#####################################################################

[tmc2209 stepper_z]
uart_pin: PE4
run_current: 1.3
hold_current: 0.8
stealthchop_threshold: 0
sense_resistor: 0.11

[stepper_z]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop   # now the INDX load cell (nozzle contact), was the Beacon
homing_retract_dist: 0
position_min: -2
position_max: 480        # was 500: the bed sits 20 mm higher on longer spacers. Re-measure Z max on the machine.
homing_speed: 2          # load-cell touch: Bondtech probes at 2 mm/s (faster overshoots and marks the bed)

[tmc2209 stepper_z1]
uart_pin: PE1
run_current: 1.3
hold_current: 0.8
stealthchop_threshold: 0
sense_resistor: 0.11

[stepper_z1]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 4

[tmc2209 stepper_z2]
uart_pin: PD3
run_current: 1.3
hold_current: 0.8
stealthchop_threshold: 0
sense_resistor: 0.11

[stepper_z2]
step_pin: PE6
dir_pin: !PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 4
