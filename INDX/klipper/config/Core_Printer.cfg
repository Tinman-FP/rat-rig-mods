#####################################################################
# V-Core 4.1 INDX: printer limits and bed. DRAFT for review; not installed, not run.
# Kinematics change from hybrid_corexy_ratrig (IDEX) to plain corexy. The bed is unchanged.
#####################################################################

[printer]
kinematics: corexy
max_velocity: 300          # keep the old limits until the belts, stops and INDX are commissioned
max_accel: 3000
square_corner_velocity: 5.0
max_z_velocity: 50
max_z_accel: 600

[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
min_temp: 0
max_temp: 120
max_power: 1.0
