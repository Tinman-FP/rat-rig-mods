#####################################################################
# MCU.cfg - All MCU serial definitions live here
#
# INDX conversion: the two EBB42 toolboards (toolboard_t0, toolboard_t1) and the two Beacons
# are gone. The Smart Head is a Kalico MCU behind the INDX Link Board (USB, 12 Mbit/s).
# Its firmware is built from the Kalico tree:
#   KCONFIG_CONFIG=board_configs/bondtech_indx_usb.config make
# The serial paths below are placeholders on purpose: this file is public.
#   [mcu]          copy the serial line from the printer's current MCU.cfg (unchanged board)
#   [mcu indxmcu]  ls /dev/serial/by-id/ and take the one that starts usb-Bondtech_INDX
# The Octopus also needs reflashing with Kalico (same board settings as before).
#####################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_REPLACE_WITH_CURRENT-if00

[mcu indxmcu]
serial: /dev/serial/by-id/usb-Bondtech_INDX_REPLACE_WITH_YOURS

[temperature_sensor Octopus_MCU]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 110
