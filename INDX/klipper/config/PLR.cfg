# PLR.cfg - power-loss recovery checkpoints, V-Core 4.1 single carriage + INDX
# DRAFT, not run. Nothing here has been loaded on the printer.
#
# Moved out of the IDEX Gcode_Macro.cfg (repo commit 277d85e) and adapted:
# - One carriage, one [extruder]. The two-carriage tracker is gone
#   (_PLR_IDEX_POSITION_STATE, PLR_CAPTURE_ACTIVE_TOOL_POSITION, PLR_IDEX_POSITION_STATUS,
#   PLR_IDEX_SET_SYNC_MODE): there is no parked carriage and no copy/mirror mode.
# - The tool is INDX's saved active_tool (toolhead.extruder is always "extruder").
#   The checkpoint records it with the latch state, the head XYZ, the G-code XYZ/E,
#   the G-code offset in effect (the tool's offsets), layer, byte position and targets.
# - One checkpoint is one saved variable, plr_snapshot, instead of about 30 SAVE_VARIABLE
#   writes. variables.cfg also holds INDX's tool state and each write rewrites the whole
#   file, so one write per layer keeps the checkpoint consistent and the file exposed
#   for less time if power drops mid-write.
# - CODEX_PLR_PRECHECK and the new PLR_VERIFY_TOOL refuse unless the tool on the head now
#   (active_tool, latch locked, seat_suspect unset) is the tool in the checkpoint.
# - Still fail closed: nothing here moves, heats or homes. RESUME_INTERRUPTED only runs the
#   precheck and CODEX_PLR_START stays locked. scripts/codex_plr_tool.py writes the staged
#   plan. Never home Z to recover: Z homing fetches T0 and probes at the bed centre.
#
# Include after the INDX files (this reads TOOL_POSITIONS):
#   [include PLR.cfg]
#   [include PLR_Shell.cfg]
# Needs: [save_variables] and [respond] (System.cfg), INDX's TOOL_POSITIONS and its saved
# active_tool / toolhead_state / seat_suspect. Callers: START_PRINT -> PLR_BEGIN_PRINT,
# PRINT_END -> PLR_END_PRINT, cancel -> PLR_CANCEL_PRINT, layer hook -> PLR_SNAPSHOT LAYER=<n>,
# startup -> DETECT_INTERRUPTION. Also call PLR_SNAPSHOT QUIET=1 after each tool change
# (slicer change-filament G-code, after T<next>) so the checkpoint tool stays current.
#####################################################################

[gcode_macro _PLR_STATE]
description: Internal state for power-loss recovery checkpoints
variable_enabled: 1
variable_interval: 1
variable_active: 0
# Z lift (mm) before X/Y homing in the recovery plan; the precheck refuses if Z + lift > Z max
variable_resume_lift: 10.0
gcode:

[gcode_macro PLR_BEGIN_PRINT]
description: Mark a virtual SD print as recoverable until normal end/cancel clears it
gcode:
  SET_GCODE_VARIABLE MACRO=_PLR_STATE VARIABLE=active VALUE=1
  SAVE_VARIABLE VARIABLE=was_interrupted VALUE=True
  SAVE_VARIABLE VARIABLE=plr_completed_normally VALUE=False
  PLR_SNAPSHOT LAYER=0 QUIET=1
  RESPOND TYPE=command MSG="PLR armed: interrupted-print latch set until PRINT_END/CANCEL clears it."

[gcode_macro PLR_END_PRINT]
description: Mark a normal print completion and clear the interrupted-print latch
gcode:
  SET_GCODE_VARIABLE MACRO=_PLR_STATE VARIABLE=active VALUE=0
  SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
  SAVE_VARIABLE VARIABLE=plr_completed_normally VALUE=True
  SAVE_VARIABLE VARIABLE=plr_last_terminal VALUE='"complete"'
  RESPOND TYPE=command MSG="PLR disarmed: normal print completion recorded."

[gcode_macro PLR_CANCEL_PRINT]
description: Mark an intentional cancel and clear the interrupted-print latch
gcode:
  SET_GCODE_VARIABLE MACRO=_PLR_STATE VARIABLE=active VALUE=0
  SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
  SAVE_VARIABLE VARIABLE=plr_last_terminal VALUE='"cancelled"'
  RESPOND TYPE=command MSG="PLR disarmed: intentional cancel recorded."

[gcode_macro PLR_ENABLE]
description: Enable power-loss checkpoints (optional INTERVAL in layers)
gcode:
  {% set interval = params.INTERVAL|default(printer["gcode_macro _PLR_STATE"].interval)|int %}
  {% if interval < 1 %}
    { action_raise_error("PLR INTERVAL must be >= 1") }
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_PLR_STATE VARIABLE=enabled VALUE=1
  SET_GCODE_VARIABLE MACRO=_PLR_STATE VARIABLE=interval VALUE={interval}
  RESPOND TYPE=command MSG="PLR enabled. Checkpoint interval={interval} layer(s)."

[gcode_macro PLR_DISABLE]
description: Disable power-loss checkpoints
gcode:
  SET_GCODE_VARIABLE MACRO=_PLR_STATE VARIABLE=enabled VALUE=0
  RESPOND TYPE=command MSG="PLR disabled."

[gcode_macro PLR_SNAPSHOT]
description: Save a power-loss checkpoint now (file/layer/head XYZ/E/tool/offsets/targets/byte). LAYER= QUIET=
gcode:
  {% set st = printer["gcode_macro _PLR_STATE"] %}
  {% set svv = printer.save_variables.variables %}
  {% set quiet = params.QUIET|default(0)|int %}
  {% if params.LAYER is defined %}
    {% set layer = params.LAYER|int %}
  {% elif "gcode_macro _LAYER_WIPE_STATE" in printer %}
    {% set layer = printer["gcode_macro _LAYER_WIPE_STATE"].count|int %}
  {% else %}
    {% set layer = printer.print_stats.info.current_layer|default(-1, true)|int %}
  {% endif %}
  {% set p = printer.toolhead.position %}
  {% set g = printer.gcode_move.gcode_position %}
  {% set o = printer.gcode_move.homing_origin %}
  {% set h = printer.toolhead.homed_axes|string %}
  {% set known = 1 if ("x" in h and "y" in h and "z" in h) else 0 %}
  # INDX's saved state: the tool on the head (-1 = empty) and the latch (0 = locked, 2 = open)
  {% set tool = svv.active_tool|default(-1)|int %}
  {% set latch = svv.toolhead_state|default(-1)|int %}
  {% set abs_e = 1 if printer.gcode_move.absolute_extrude else 0 %}
  {% set filepath = printer.virtual_sdcard.file_path|default("")|string %}
  {% if filepath == "None" %}
    {% set filepath = "" %}
  {% endif %}
  {% set file = printer.print_stats.filename|default("")|string %}
  {% if file == "" or file == "None" %}
    {% set parts = filepath.split("/") %}
    {% set file = parts[-1] if filepath != "" else "n/a" %}
  {% endif %}
  {% set bed_t = printer.heater_bed.target|float if "heater_bed" in printer else 0.0 %}
  {% set h_t = printer.extruder.target|float %}
  {% set chamber_t = printer["heater_generic chamber_heater1"].target|float if "heater_generic chamber_heater1" in printer else 0.0 %}
  {% set pos = printer.virtual_sdcard.file_position|default(0)|int %}
  {% set size = printer.virtual_sdcard.file_size|default(0)|int %}
  # SAVE_VARIABLE parses a Python literal and the G-code parser cuts at comment characters:
  # keep only plain characters in the names (the host tool reads the real name from Moonraker)
  {% set safe = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789._-+/()[] ,=@" %}
  {% set ns = namespace(file="", path="") %}
  {% for c in file %}{% set ns.file = ns.file ~ (c if c in safe else "_") %}{% endfor %}
  {% for c in filepath %}{% set ns.path = ns.path ~ (c if c in safe else "_") %}{% endfor %}
  {% set snap = '{"layer": %d, "tool": %d, "latch": %d, "known": %d, "x": %.3f, "y": %.3f, "z": %.3f, "gx": %.3f, "gy": %.3f, "gz": %.3f, "e": %.5f, "ox": %.3f, "oy": %.3f, "oz": %.3f, "abs_e": %d, "bed": %.1f, "hotend": %.1f, "chamber": %.1f, "pos": %d, "size": %d, "file": "%s", "path": "%s"}' % (layer, tool, latch, known, p.x, p.y, p.z, g.x, g.y, g.z, g.e, o.x, o.y, o.z, abs_e, bed_t, h_t, chamber_t, pos, size, ns.file, ns.path) %}
  SAVE_VARIABLE VARIABLE=plr_snapshot VALUE='{snap}'
  {% set raw_interrupted = svv.was_interrupted|default(False) %}
  {% set interrupted = raw_interrupted == True or raw_interrupted|string|lower in ["true", "1", "yes", "on"] %}
  {% if st.active|int == 1 and not interrupted %}
    SAVE_VARIABLE VARIABLE=was_interrupted VALUE=True
  {% endif %}
  {% if quiet == 0 %}
    RESPOND TYPE=command MSG="PLR snapshot saved: file={ns.file}, layer={layer}, byte={pos}, tool={('T%d' % tool) if tool >= 0 else 'none'}, X={'%.2f'|format(p.x)} Y={'%.2f'|format(p.y)} Z={'%.2f'|format(p.z)}, offset Z={'%.3f'|format(o.z)}"
  {% endif %}

[gcode_macro PLR_STATUS]
description: Show last saved power-loss checkpoint and the tool on the head now
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set s = svv.plr_snapshot|default({}) %}
  {% set tool = s.tool|default(-1)|int %}
  {% set act = svv.active_tool|default(-1)|int %}
  {% set latch = svv.toolhead_state|default(-1)|int %}
  {% set suspect = svv.seat_suspect|default(-1)|int %}
  {% set raw_interrupted = svv.was_interrupted|default(False) %}
  {% set interrupted = raw_interrupted == True or raw_interrupted|string|lower in ["true", "1", "yes", "on"] %}
  RESPOND TYPE=command MSG="PLR last file={s.file|default('n/a')}"
  RESPOND TYPE=command MSG="PLR last layer={s.layer|default(-1)|int} tool={('T%d' % tool) if tool >= 0 else 'none'} head XYZ=({'%.2f'|format(s.x|default(0.0)|float)}, {'%.2f'|format(s.y|default(0.0)|float)}, {'%.2f'|format(s.z|default(0.0)|float)}) homed={s.known|default(0)|int}"
  RESPOND TYPE=command MSG="PLR last G-code Z={'%.3f'|format(s.gz|default(0.0)|float)} E={'%.3f'|format(s.e|default(0.0)|float)} offset XYZ=({'%.3f'|format(s.ox|default(0.0)|float)}, {'%.3f'|format(s.oy|default(0.0)|float)}, {'%.3f'|format(s.oz|default(0.0)|float)})"
  RESPOND TYPE=command MSG="PLR last byte={s.pos|default(0)|int}/{s.size|default(0)|int} interrupted={interrupted}"
  RESPOND TYPE=command MSG="PLR last targets: bed={'%.1f'|format(s.bed|default(0.0)|float)}C hotend={'%.1f'|format(s.hotend|default(0.0)|float)}C chamber={'%.1f'|format(s.chamber|default(0.0)|float)}C"
  RESPOND TYPE=command MSG="PLR head now: active_tool={('T%d' % act) if act >= 0 else 'none'} latch={'locked' if latch == 0 else ('open' if latch == 2 else 'unknown')} seat_suspect={('T%d' % suspect) if suspect >= 0 else 'none'}"

[gcode_macro PLR_CLEAR]
description: Clear last power-loss checkpoint (INDX tool state is left alone)
gcode:
  {% set empty = '{"layer": -1, "tool": -1, "known": 0, "pos": 0, "size": 0, "file": "n/a", "path": ""}' %}
  SET_GCODE_VARIABLE MACRO=_PLR_STATE VARIABLE=active VALUE=0
  SAVE_VARIABLE VARIABLE=plr_snapshot VALUE='{empty}'
  SAVE_VARIABLE VARIABLE=was_interrupted VALUE=False
  SAVE_VARIABLE VARIABLE=plr_completed_normally VALUE=False
  SAVE_VARIABLE VARIABLE=plr_last_terminal VALUE='"cleared"'
  RESPOND TYPE=command MSG="PLR checkpoint cleared."

[gcode_macro CODEX_PLR_CLEAR]
description: Clear Codex/Rat Rig interrupted-print state
gcode:
  PLR_CLEAR
  RESPOND TYPE=command MSG="CODEX_PLR_CLEAR complete. Host snapshots can be archived with codex_plr_tool.py clear --yes."

[gcode_macro RESUME_INTERRUPTED]
description: Safe PLR entrypoint; validates state but does not move the printer
gcode:
  CODEX_PLR_PRECHECK

[gcode_macro PLR_VERIFY_TOOL]
description: Refuse unless TOOL=<n> is the tool on the head now (active_tool, latch locked, seat_suspect unset). Reads only, no motion or heat
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set want = params.TOOL|default(-1)|int %}
  {% set act = svv.active_tool|default(-1)|int %}
  {% set latch = svv.toolhead_state|default(-1)|int %}
  {% set suspect = svv.seat_suspect|default(-1)|int %}
  {% set count = printer["gcode_macro TOOL_POSITIONS"].tool_count|default(0)|int if "gcode_macro TOOL_POSITIONS" in printer else 0 %}
  {% if want < 0 %}
    { action_raise_error("PLR_VERIFY_TOOL refused: the checkpoint recorded no tool on the head (power lost during a tool change?). Re-slice from the last good layer instead.") }
  {% elif count > 0 and want >= count %}
    { action_raise_error("PLR_VERIFY_TOOL refused: T%d is not configured (%d tools)." % (want, count)) }
  {% elif suspect >= 0 %}
    { action_raise_error("PLR_VERIFY_TOOL refused: seat_suspect is set, T%d may be half seated. Check the head by hand, run MANUAL_TOOL_REMOVE or MANUAL_TOOL_SEAT TOOL=<n>, then the precheck again." % suspect) }
  {% elif act < 0 %}
    { action_raise_error("PLR_VERIFY_TOOL refused: no tool recorded on the head (active_tool=-1), the checkpoint needs T%d. If T%d is on the head, hold it and run MANUAL_TOOL_SEAT TOOL=%d, then the precheck again." % (want, want, want)) }
  {% elif act != want %}
    { action_raise_error("PLR_VERIFY_TOOL refused: tool mismatch. The checkpoint was printed with T%d but active_tool says T%d. Do not heat or move. Sort the head out by hand (MANUAL_TOOL_REMOVE / MANUAL_TOOL_SEAT TOOL=%d) or re-slice." % (want, act, want)) }
  {% elif latch != 0 %}
    { action_raise_error("PLR_VERIFY_TOOL refused: the latch is not recorded as locked (toolhead_state=%d). Check T%d is fully on the head, then MANUAL_TOOL_SEAT TOOL=%d." % (latch, want, want)) }
  {% else %}
    RESPOND TYPE=command MSG="PLR_VERIFY_TOOL passed: T{want} recorded on the head, latch locked, no seat_suspect. This is saved state: run TOOL_STATUS and look at the head."
  {% endif %}

[gcode_macro CODEX_PLR_PRECHECK]
description: Validate interrupted-print state and the tool on the head without moving or heating
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set s = svv.plr_snapshot|default({}) %}
  {% set raw_interrupted = svv.was_interrupted|default(False) %}
  {% set interrupted = raw_interrupted == True or raw_interrupted|string|lower in ["true", "1", "yes", "on"] %}
  {% set file = s.file|default("n/a")|string %}
  {% set byte = s.pos|default(0)|int %}
  {% set z = s.z|default(0.0)|float %}
  {% set y = s.y|default(-9999.0)|float %}
  {% set layer = s.layer|default(-1)|int %}
  {% set known = s.known|default(0)|int %}
  {% set tool = s.tool|default(-1)|int %}
  {% set lift = printer["gcode_macro _PLR_STATE"].resume_lift|float %}
  {% set zmax = printer.toolhead.axis_maximum.z|float %}
  {% set clear_y = printer["gcode_macro TOOL_POSITIONS"].clearance_y|float if "gcode_macro TOOL_POSITIONS" in printer else 0.0 %}
  {% set active = printer.virtual_sdcard.is_active|default(False) %}
  {% if not interrupted %}
    { action_raise_error("CODEX_PLR_PRECHECK refused: no interrupted print is recorded") }
  {% elif active %}
    { action_raise_error("CODEX_PLR_PRECHECK refused: virtual_sdcard is already active") }
  {% elif file in ["", "None", "n/a"] %}
    { action_raise_error("CODEX_PLR_PRECHECK refused: missing saved file path/name for PLR") }
  {% elif byte <= 0 %}
    { action_raise_error("CODEX_PLR_PRECHECK refused: missing saved virtual_sdcard byte position") }
  {% elif layer < 1 %}
    { action_raise_error("CODEX_PLR_PRECHECK refused: the checkpoint is from before layer 1 (layer %d). Start the print again." % layer) }
  {% elif known != 1 %}
    { action_raise_error("CODEX_PLR_PRECHECK refused: the head was not homed when the checkpoint was saved") }
  {% elif z <= 0 %}
    { action_raise_error("CODEX_PLR_PRECHECK refused: missing saved positive Z height") }
  {% elif z + lift > zmax %}
    { action_raise_error("CODEX_PLR_PRECHECK refused: saved Z %.3f + lift %.1f is above Z max %.1f" % (z, lift, zmax)) }
  {% elif y < clear_y %}
    { action_raise_error("CODEX_PLR_PRECHECK refused: the head was at the docks (Y %.2f, below clearance_y %.2f) when the checkpoint was saved, a tool change was running" % (y, clear_y)) }
  {% elif tool < 0 %}
    { action_raise_error("CODEX_PLR_PRECHECK refused: the checkpoint recorded no tool on the head") }
  {% else %}
    PLR_VERIFY_TOOL TOOL={tool}
    RESPOND TYPE=command MSG="CODEX_PLR_PRECHECK passed: file={file}, layer={layer}, byte={byte}, Z={'%.3f'|format(z)}, tool=T{tool}."
    RESPOND TYPE=command MSG="Motion remains locked. Review host snapshot: /home/pi/printer_data/config/scripts/codex_plr_tool.py precheck"
    RESPOND TYPE=command MSG="After inspection, clear state with CODEX_PLR_CLEAR."
  {% endif %}

[gcode_macro CODEX_PLR_START]
description: Locked placeholder for future supervised Rat Rig PLR start
gcode:
  { action_raise_error("CODEX_PLR_START is locked: physical/Z validation workflow is not installed yet") }

[gcode_macro DETECT_INTERRUPTION]
description: Report any saved interrupted-print state after Kalico starts
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set s = svv.plr_snapshot|default({}) %}
  {% set raw_interrupted = svv.was_interrupted|default(False) %}
  {% set interrupted = raw_interrupted == True or raw_interrupted|string|lower in ["true", "1", "yes", "on"] %}
  {% set tool = s.tool|default(-1)|int %}
  {% set act = svv.active_tool|default(-1)|int %}
  {% set suspect = svv.seat_suspect|default(-1)|int %}
  {% if interrupted %}
    RESPOND TYPE=error MSG="Possible interrupted print recorded: file={s.file|default('n/a')}, layer={s.layer|default(-1)|int}, byte={s.pos|default(0)|int}, Z={'%.3f'|format(s.z|default(0.0)|float)}, tool={('T%d' % tool) if tool >= 0 else 'none'}."
    {% if tool < 0 or act != tool or suspect >= 0 %}
      RESPOND TYPE=error MSG="PLR: the tool on the head now ({('T%d' % act) if act >= 0 else 'none'}, seat_suspect={('T%d' % suspect) if suspect >= 0 else 'none'}) does not match the checkpoint. Recovery will refuse."
    {% else %}
      RESPOND TYPE=command MSG="PLR: active_tool T{act} matches the checkpoint. Check the head by hand before trusting it."
    {% endif %}
    RESPOND TYPE=command MSG="Next: CODEX_PLR_PRECHECK. Do not home Z (it fetches T0 and probes the bed centre). Clear only after inspection: CODEX_PLR_CLEAR."
  {% else %}
    RESPOND TYPE=command MSG="PLR boot check: no interrupted print recorded."
  {% endif %}

[gcode_macro PLR_RECOVERY_HELP]
description: Show practical outage recovery workflow using saved checkpoints
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set s = svv.plr_snapshot|default({}) %}
  RESPOND TYPE=command MSG="PLR helper: last known file={s.file|default('n/a')}, layer={s.layer|default(-1)|int}, tool=T{s.tool|default(-1)|int}."
  RESPOND TYPE=command MSG="Run CODEX_PLR_PRECHECK first. It validates state and the tool on the head and does not move the printer."
  RESPOND TYPE=command MSG="For host report/plan: /home/pi/printer_data/config/scripts/codex_plr_tool.py precheck"
  RESPOND TYPE=command MSG="Do not home Z with the part on the bed. Do not run byte-level resume until physical/Z clearance is verified."

[gcode_macro AUTO_RECOVER_WIZARD]
description: Guided recovery steps from last PLR checkpoint
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set s = svv.plr_snapshot|default({}) %}
  {% set file = s.file|default("n/a")|string %}
  {% set layer = s.layer|default(-1)|int %}
  {% set tool = s.tool|default(-1)|int %}
  {% set bed_t = s.bed|default(0.0)|float %}
  {% set hot_t = s.hotend|default(0.0)|float %}
  {% if layer < 0 or file == "n/a" %}
    RESPOND TYPE=error MSG="AUTO_RECOVER_WIZARD: no PLR checkpoint found. Run PLR_STATUS."
  {% else %}
    {% set restart_layer = layer - 2 if layer > 2 else 0 %}
    RESPOND TYPE=command MSG="AUTO_RECOVER_WIZARD: last file={file}, checkpoint layer={layer}, tool={('T%d' % tool) if tool >= 0 else 'none'}."
    RESPOND TYPE=command MSG="Step 1: run CODEX_PLR_PRECHECK. It validates state and the tool on the head and does not move the printer."
    RESPOND TYPE=command MSG="Step 2: inspect /home/pi/printer_data/config/codex_plr/codex_plr_precheck_report.txt."
    RESPOND TYPE=command MSG="Step 3: if byte resume is unsafe, re-slice from layer ~{restart_layer} with TOOL={tool}, BED={'%.1f'|format(bed_t)}C, HOTEND={'%.1f'|format(hot_t)}C."
  {% endif %}
