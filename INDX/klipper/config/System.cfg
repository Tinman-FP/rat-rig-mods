# System.cfg
#####################################################################

[virtual_sdcard]
path: ~/printer_data/gcodes
# Codex PLR virtual_sdcard durability patch settings.
# Leave commented until ~/klipper/klippy/extras/virtual_sdcard.py has been
# patched to support these options.
# plr_enabled: True
# plr_record_path: /home/pi/printer_data/config/codex_plr/plr_record
# plr_save_every_n_lines: 50

[pause_resume]
[display_status]

[idle_timeout]
timeout: 1800

[exclude_object]

# One [save_variables] only: INDX keeps its tool state (active_tool, latch, per-tool offsets,
# toolchange count, speed mode) here too. Bondtech's README names indx_vars.cfg; this machine
# keeps the existing file.
[save_variables]
filename: ~/printer_data/config/variables.cfg

# Every INDX macro prints with RESPOND (mainsail.cfg also declares it; declaring it twice is harmless)
[respond]
