#####################################################################
# V-Core 4.1 500: single-carriage CoreXY, 12 mm belts, Bondtech INDX (5 tools)
# DRAFT for review. Not installed; not run on the printer.
#
# Replaces Motion_XY.cfg ([stepper_x], [dual_carriage], [stepper_y], [stepper_y1])
# and the custom hybrid_corexy_ratrig kinematics. Pins are the owner's existing
# BTT Octopus assignments from rat-rig-dual-beacon-500-idex-config.
#
# Coordinates (see cad/.../source/vc12_params.py):
#   X = CAD nozzle X + 255     -> PEI spans X 0..510
#   Y = CAD beam Y + 225.8     -> printable Y 0..484.5 (PEI rear edge). Y 0 is the clearance line: 40 mm
#                                 behind the docked nozzles (radial-cooling ducts need it; Bondtech's 26 does not clear)
#   Docks: tools park at Y -40.0; X -8, 108, 224, 340, 456 (116 mm pitch). Calibrate both.
#   Each tool's purge bucket and wiper pad sits just right of its dock: see purge_wipe.cfg.
#
# Wiring:
#   A belt (lower, left rear motor, mounted under the corner)  -> MOTOR0, as the old stepper_x
#   B belt (upper, right rear motor, mounted over the corner)  -> MOTOR1, the old stepper_y socket
#   MOTOR3 (old stepper_y1) and MOTOR4 (old dual_carriage) become free.
#####################################################################

[printer]
kinematics: corexy
max_velocity: 300          # keep the old limits until the belts, stops and INDX are commissioned
max_accel: 3000
square_corner_velocity: 5.0
max_z_velocity: 50
max_z_accel: 600

[stepper_x]                # motor A: moves +X+Y together
step_pin: PF13
dir_pin: PF12              # set the direction with STEPPER_BUZZ and the CoreXY direction table
enable_pin: !PF14
microsteps: 64
rotation_distance: 40      # 20T x 2 mm
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -35
position_min: -35          # carriage against the left joint
position_max: 545
homing_speed: 25
second_homing_speed: 5
homing_retract_dist: 5

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 1.40          # check the motor's rating first; the old value was 1.28
stealthchop_threshold: 0
diag_pin: PG6
driver_SGTHRS: 46          # retune for the new belts and stops

[stepper_y]                # motor B: moves +X-Y
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 64
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 488.8    # Y homes to the REAR stop: the docks are at the front
position_min: -41          # tool pickup at -40.0
position_max: 488.8
homing_positive_dir: true
homing_speed: 25
second_homing_speed: 5
homing_retract_dist: 5

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 1.40
stealthchop_threshold: 0
diag_pin: PG9
driver_SGTHRS: 46

#####################################################################
# INDX: install Bondtech's indx_klipper (mainline) or use Kalico, then follow
# Bondtech's README for [mcu indxmcu], [indx], [extruder] (sensor_type: indx,
# rotation_distance 5.7, do not change), [load_cell_probe] and the includes.
# Values specific to this machine, to set in indx.cfg and then calibrate:
#   tool_count: 5
#   dock_dir: -1          # docks at the front
#   dock_y: -40.0         # CAL_SET_DOCK_Y
#   clearance_y: 0.0      # 40 mm behind the docks; X moves happen here (26 is too close with radial cooling)
#   t0_x..t4_x: -8, 108, 224, 340, 456   # CALIBRATE_DOCK_X TOOL=n (T0 is left of the PEI; X min is -35)
# Homing: merge Bondtech's homing.cfg into one [homing_override]:
#   Y to the rear stop, then X at clearance_y, then pick up T0, then Z on the load cell.
# Z: the bed sits 20 mm higher on longer spacers; re-home and re-measure Z max.
#####################################################################
