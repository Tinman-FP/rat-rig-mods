#####################################################################
# V-Core 4.1 INDX: one purge bucket and one Qidi wiper pad per tool. DRAFT, not run.
#
# Each tool's station sits just right of its own dock, in front of the bed and below the head
# (CAD: vc12_params.py). In printer coordinates (X = CAD X + 255), all at Y -40.0, the dock row:
#   tool            T0    T1    T2    T3    T4
#   dock X          -8   108   224   340   456
#   purge X         39   155   271   387   503   (47 mm right of the dock)
#   pad left edge   45   161   277   393   509   (15 mm wide in X, 27 deep in Y; the nozzle wipes
#                                                  3 mm in from its rear edge)
#   wipe stroke     purge X + 4 .. purge X + 20   (starts and ends just off the pad's left end)
# Pad top 1.2 mm above the nozzle tip; set it with the station-rail brackets' slotted holes.
# The bed's height does not matter here: the stations are in front of the bed, not over it.
# Reach a station only from clearance_y (0.0), moving in Y at the purge X: the head clears the docks
# on either side by 5.6 and 4.5 mm more than it needs (Bondtech's real ducts), and only along Y.
#####################################################################

[gcode_macro _STATION_VARS]
variable_clearance_y: 0.0
variable_station_y: -40.0
variable_purge_x: [39, 155, 271, 387, 503]
variable_wipe_from: 4.0       # relative to purge_x
variable_wipe_to: 20.0
variable_passes: 3
variable_travel_f: 12000
variable_wipe_f: 6000
gcode:

[gcode_macro PURGE_AND_WIPE]
description: Purge the active tool into its own bucket, then wipe it on its own pad. TOOL=n LENGTH=mm
gcode:
    {% set v = printer["gcode_macro _STATION_VARS"] %}
    {% set tool = params.TOOL|int %}
    {% set length = params.LENGTH|default(15)|float %}
    {% set px = v.purge_x[tool] %}
    {% if printer[printer.toolhead.extruder].temperature < printer[printer.toolhead.extruder].target - 5 %}
        { action_raise_error("PURGE_AND_WIPE: heat the tool first") }
    {% endif %}
    SAVE_GCODE_STATE NAME=purge_wipe
    G90
    G1 Y{v.clearance_y} F{v.travel_f}
    G1 X{px} F{v.travel_f}
    G1 Y{v.station_y} F{v.travel_f}
    M83
    G1 E{length} F{4 * 60}               # about 4 mm/s of filament
    G1 E-0.8 F2400
    G4 P1500                             # let the strand drop into the bucket
    G1 X{px + v.wipe_from} F{v.travel_f}
    {% for i in range(v.passes) %}
        G1 X{px + v.wipe_to} F{v.wipe_f}
        G1 X{px + v.wipe_from} F{v.wipe_f}
    {% endfor %}
    G1 Y{v.clearance_y} F{v.travel_f}
    RESTORE_GCODE_STATE NAME=purge_wipe
