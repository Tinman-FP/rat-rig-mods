#####################################################################
# V-Core 4.1 INDX: homing. DRAFT for review. Not installed; not run on the printer.
#
# Bondtech's INDX homing with the X/Y part done the way the owner's FibreSeek Seeker 3
# does it: each axis is homed twice, Y first, and the second pass always starts from the
# same spot, so the stall is detected at the same speed and distance every time.
#
#   1. Lift Z (Bondtech's _INDX_SAFE_Z_HOP: moves all three Z motors together).
#   2. Home Y to the rear stop from wherever the head is, then go to 100 mm in front of it.
#   3. Home X to the left stop, then go to 100 mm right of it.
#   4. Home Y again, then X again, with a 1 s pause before each pass so the driver's
#      stall flag clears. Finish 4 mm off each stop.
#   5. Pick up T0 and home Z on the load cell (Bondtech's _INDX_HOME_Z, unchanged).
#
# X is homed only behind the clearance line (Y 388.8 or 484.8), so it never sweeps the docks.
# G28 X alone, with Y already homed, first moves straight back to Y 388.8.
# The steppers use homing_retract_dist: 0 (see motion_corexy12_indx.cfg): this macro
# does the second pass and the move off the stop, so Klipper's own slow re-home is off.
#
# Include order: after Bondtech's files, so this [homing_override] replaces theirs.
#   [include indx/indx.cfg]
#   [include indx/indx-tc-macros.cfg]
#   [include indx/indx-cal.cfg]
#   [include indx/homing.cfg]
#   [include homing_indx.cfg]
# Klipper reads two sections with the same name as one, and the later lines win, so this
# gcode replaces Bondtech's while their helper macros (_INDX_SAFE_Z_HOP, _INDX_HOME_Z,
# the checks) stay as Bondtech ships them.
#
# Derived from Bondtech's macros/homing.cfg (github.com/BondtechAB/INDX, GPL-3.0,
# commit 05018b2, 2026-10-20). Only steps 2 and 3 of their [homing_override] changed.
# This file is GPL-3.0 as well. When Bondtech updates homing.cfg, compare its
# [homing_override] with the one below.
#####################################################################

[homing_override]
axes: xyz
gcode:
    {% set home_all = not ('X' in params or 'Y' in params or 'Z' in params) %}
    {% set home_x = home_all or 'X' in params %}
    {% set home_z = home_all or 'Z' in params %}
    # X requires Y: G28 X with Y unknown homes Y first
    {% set home_y = home_all or 'Y' in params
        or (home_x and "y" not in printer.toolhead.homed_axes) %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    _INDX_CHECK_CLEARANCE
    # A failed pickup may have left a tool half seated on the head: no Z home
    # until the head has been checked by hand
    {% if home_z %}
        _INDX_CHECK_SUSPECT
    {% endif %}
    # In the first seconds after a restart INIT_STATE has not built the tools
    # list yet; the T0 fetch below needs it
    {% if tp.tools|length == 0 %}
        _INDX_BUILD_TOOLS
    {% endif %}
    # With Z unhomed a loaded bed mesh has no valid reference and would refuse
    # the X/Y moves below: drop it (Bondtech's step, unchanged)
    {% if "z" not in printer.toolhead.homed_axes and "bed_mesh" in printer %}
        {% set mm = printer.bed_mesh.mesh_matrix|default([[]]) %}
        {% if mm|length and mm[0]|length %}
            RESPOND MSG="INDX: bed mesh cleared, Z is not homed"
        {% endif %}
        BED_MESH_CLEAR
    {% endif %}
    # Z homes on T0: with any other tool (or none) on the head G28 fetches T0
    # from its dock, which needs calibrated dock positions
    {% if home_z and printer.save_variables.variables.active_tool|default(-1)|int != 0 %}
        _INDX_CHECK_DOCKS FOR=home
    {% endif %}

    # 1. Clear Z before any axis home
    _INDX_SAFE_Z_HOP

    # 2-3. Y then X, each homed twice (FibreSeek pattern; replaces Bondtech's single passes)
    {% if home_x or home_y %}
        _HOME_XY_TWICE X={1 if home_x else 0} Y={1 if home_y else 0}
    {% endif %}

    # 4. Z needs a seated tool (load cell = nozzle probe)
    {% if home_z %}
        _INDX_HOME_Z
    {% endif %}

[gcode_macro _HOME_XY_TWICE]
description: Inner - home Y and/or X twice, Y first, the second pass from a fixed spot. Called by G28 only.
variable_start_dist: 100.0    # the second pass starts this far from the stop
variable_finish_dist: 4.0     # the head ends this far off the stop
variable_dwell_ms: 1000       # before each pass after the first, so the driver's stall flag clears
variable_travel_f: 6000       # mm/min for the moves between passes
gcode:
    {% set v = printer["gcode_macro _HOME_XY_TWICE"] %}
    {% set do_x = params.X|default(0)|int == 1 %}
    {% set do_y = params.Y|default(0)|int == 1 %}
    {% set sx = printer.configfile.settings.stepper_x %}
    {% set sy = printer.configfile.settings.stepper_y %}
    # Away from each stop: X homes to its minimum (left), Y to its maximum (rear)
    {% set x_away = -1.0 if sx.homing_positive_dir else 1.0 %}
    {% set y_away = -1.0 if sy.homing_positive_dir else 1.0 %}
    # Targets are machine positions; G0 adds any tool offset, so take it off here
    {% set ox = printer.gcode_move.homing_origin.x|float %}
    {% set oy = printer.gcode_move.homing_origin.y|float %}
    {% set x_start = sx.position_endstop|float + x_away * v.start_dist - ox %}
    {% set y_start = sy.position_endstop|float + y_away * v.start_dist - oy %}
    {% set x_end = sx.position_endstop|float + x_away * v.finish_dist - ox %}
    {% set y_end = sy.position_endstop|float + y_away * v.finish_dist - oy %}
    G90
    # Pass 1, from wherever the head is
    {% if do_y %}
        G28 Y
    {% endif %}
    # Y is now homed. Go 100 mm in front of the rear stop: well behind the docks, where X may sweep.
    G0 Y{"%.3f"|format(y_start)} F{v.travel_f|int}
    {% if do_x %}
        G4 P{v.dwell_ms|int}
        G28 X
        G0 X{"%.3f"|format(x_start)} F{v.travel_f|int}
    {% endif %}
    # Pass 2, from the same spot every time
    {% if do_y %}
        G4 P{v.dwell_ms|int}
        G28 Y
        G0 Y{"%.3f"|format(y_end)} F{v.travel_f|int}
    {% endif %}
    {% if do_x %}
        G4 P{v.dwell_ms|int}
        G28 X
        G0 X{"%.3f"|format(x_end)} F{v.travel_f|int}
    {% endif %}
    M400
